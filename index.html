<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英文智能讀默</title>
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

  <!-- 頂部導覽列：左上 Key Icon、右上 設定 Icon -->
  <header class="top-nav">
    <button class="icon-btn" onclick="openKeyModal()" aria-label="API 金鑰設定">
      🔑
      <span id="keyMissingDot" class="dot-badge" style="display:none;"></span>
    </button>

    <h1 class="app-title">📖 英文讀默</h1>

    <button class="icon-btn" onclick="openSettingsModal()" aria-label="系統設定">
      ⚙️
    </button>
  </header>

  <main class="container">

    <!-- 雲端斷點續傳自動偵測橫幅 (當發現上次有未完成課文時顯示) -->
    <div id="cloudResumeBanner" class="card" style="display:none; background:#fffbeb; border-color:#fde68a;">
      <div style="font-weight:700; font-size:0.92rem; color:#b45309; margin-bottom:8px;">
        ⚠️ 發現未完成上傳的課文：<span id="resumeLessonName"></span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-warning" style="flex:1; padding:8px;" onclick="resumeFromCloudTask()">🔄 接續處理</button>
        <button class="btn btn-outline" style="padding:8px 12px;" onclick="discardCloudTask()">捨棄</button>
      </div>
    </div>

    <!-- 視圖 A：【加入課文介面】 (與播放介面互斥；無課文時直接顯示此頁) -->
    <section id="viewAddLesson" class="card" style="display:none;">
      <div class="card-header">
        <h2 class="card-title">✨ 加入新課文</h2>
        <button id="btnBackToPlayer" class="btn btn-outline" style="padding:6px 10px; font-size:0.82rem; display:none;" onclick="switchView('PLAYER')">返回播放</button>
      </div>

      <!-- 輸入表單區：當開始上傳時整塊隱藏，避免誤觸 -->
      <div id="addFormArea">
        <label>課文標題 (選填，留空由 AI 自動命名):</label>
        <input type="text" id="newLessonTitle" placeholder="例如: Unit 2 - My School">

        <!-- 圖片上傳區 -->
        <div id="imageInputBlock">
          <label>拍攝或選取課本相片 (OCR 智能辨識):</label>
          <input type="file" id="ocrImageInput" accept="image/*" onchange="onImageSelected()">
          <div id="selectedImageHint" style="display:none; margin-top:8px; padding:10px; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; font-size:0.85rem; justify-content:space-between; align-items:center;">
            <span id="selectedImageName" style="color:#166534; font-weight:600;">已選取相片</span>
            <button type="button" class="btn btn-outline" style="padding:4px 8px; font-size:0.78rem;" onclick="clearSelectedImage()">移除相片</button>
          </div>
        </div>

        <!-- 文字輸入區 (當選取相片後自動隱藏，防誤入錯資料) -->
        <div id="textInputBlock">
          <label>或直接貼上課文文字:</label>
          <textarea id="newLessonText" rows="4" placeholder="貼上英文段落，系統將自動按自然語意切分..." oninput="onTextInputChanged()"></textarea>
        </div>

        <button id="btnStartBuild" class="btn" style="width:100%; margin-top:14px;" onclick="startOneClickBuild()">
          🚀 一鍵分析、生成語音並上傳
        </button>
      </div>

      <!-- 進度與斷點續傳顯示區 (開始處理後只顯示此區塊) -->
      <div id="buildProgressArea" class="progress-box" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span id="progStepPill" class="step-pill">Step 1 / 3</span>
          <span id="progPercentText" style="font-size:0.85rem; font-weight:700; color:var(--primary);">0%</span>
        </div>
        <div id="progTargetTitle" style="font-weight:700; font-size:0.95rem; margin:4px 0;">準備中...</div>
        <div id="progCurrentAction" style="font-size:0.86rem; color:var(--text-sub);">正在初始化...</div>

        <div class="progress-bar-bg">
          <div id="progBarFill" class="progress-bar-fill"></div>
        </div>

        <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--text-sub); font-weight:600;">
          <span id="progDoneStat">已完成: 0</span>
          <span id="progRemainStat">尚餘未完成: 0</span>
        </div>

        <!-- 失敗時出現的一鍵斷點續傳按鈕 -->
        <button id="btnResumeOnError" class="btn btn-warning" style="width:100%; margin-top:12px; display:none;" onclick="continuePipelineFromCheckpoint()">
          🔄 從失敗斷點繼續處理 (免重 Call 已完成 API)
        </button>
      </div>
    </section>

    <!-- 視圖 B：【課文目錄與播放介面】 (有課文且非加入狀態時顯示) -->
    <section id="viewPlayer" class="card" style="display:none;">
      <!-- 1. 課文目錄選擇列 -->
      <div id="catalogBar" class="lesson-select-bar">
        <select id="lessonDropdown" onchange="selectLesson(this.value)"></select>
        <button class="btn" style="padding:10px 12px; font-size:0.85rem;" onclick="switchView('ADD')">＋ 加入</button>
        <button class="btn btn-outline" style="padding:10px 10px; color:var(--danger);" onclick="deleteCurrentLesson()" title="刪除課文">🗑️</button>
      </div>

      <!-- 狀態列與隱藏文字開關 -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0;">
        <div id="playerBanner" style="font-size:0.86rem; font-weight:600; color:var(--primary);">準備中...</div>
        <label style="margin:0; font-size:0.84rem; display:flex; align-items:center; gap:4px; cursor:pointer;">
          <input type="checkbox" id="maskTextCheckbox" onchange="renderChunks()"> 🙈 隱藏文字
        </label>
      </div>

      <!-- 播放控制按鈕組 -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
        <button id="btnPlay" class="btn btn-success" onclick="startOrResumeDictation()" disabled>▶ 開始讀默</button>
        <button id="btnPause" class="btn btn-warning" onclick="pauseDictation()" disabled>⏸ 暫停</button>
      </div>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
        <button id="btnReplay" class="btn btn-outline" onclick="replayCurrentChunk()" disabled>🔄 重播此句</button>
        <button id="btnStop" class="btn btn-outline" onclick="stopDictation()" disabled>⏹ 停止</button>
      </div>

      <!-- 單一 HTML5 Audio 實例 (配合瀏覽器即時控制 playbackRate) -->
      <audio id="mainAudio" playsinline controls style="width:100%; margin-bottom:8px;"></audio>

      <!-- 意群清單 -->
      <div id="chunkListContainer" class="chunk-grid"></div>
    </section>

  </main>

  <!-- 左上：API Key 設定 Modal -->
  <div id="keyModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-header">
        <h3 class="card-title">🔑 API 金鑰設定</h3>
        <button class="icon-btn" style="width:32px; height:32px; border:none;" onclick="closeModal('keyModal')">✕</button>
      </div>
      <div id="keyItemsContainer"></div>
      <button id="btnSaveKeys" class="btn" style="width:100%; margin-top:16px;" onclick="submitKeys()">
        💾 儲存金鑰
      </button>
    </div>
  </div>

  <!-- 右上：系統設定 Modal (關閉/儲存時才同步至雲端) -->
  <div id="settingsModal" class="modal-backdrop">
    <div class="modal">
      <div class="card-header">
        <h3 class="card-title">⚙️ 系統設定</h3>
        <button class="icon-btn" style="width:32px; height:32px; border:none;" onclick="closeModal('settingsModal')">✕</button>
      </div>

      <label>TTS 語音模型:</label>
      <select id="setVoiceSelect" style="margin-bottom:10px;"></select>

      <label>分拆句子 / OCR 模型:</label>
      <select id="setGeminiSelect" style="margin-bottom:14px;"></select>

      <!-- 1. 播放速度：[+按鈕] [inputbox] [-按鈕] (0.5 ~ 1.5, 幅度 0.05, 預設 0.8) -->
      <div class="stepper-group">
        <div class="stepper-label">
          <span>播放速度 (瀏覽器即時變速)</span>
          <span style="color:var(--text-sub);">0.5 ~ 1.5</span>
        </div>
        <div class="stepper">
          <button type="button" class="stepper-btn" onclick="adjustStepper('playbackRate', 0.05, 0.5, 1.5, 2)">＋</button>
          <input type="text" id="input_playbackRate" class="stepper-display" readonly>
          <button type="button" class="stepper-btn" onclick="adjustStepper('playbackRate', -0.05, 0.5, 1.5, 2)">－</button>
        </div>
      </div>

      <!-- 2. 讀幾次：[+按鈕] [inputbox] [-按鈕] (1 ~ 5, 幅度 1, 預設 2) -->
      <div class="stepper-group">
        <div class="stepper-label">
          <span>每組朗讀次數</span>
          <span style="color:var(--text-sub);">1 ~ 5 次</span>
        </div>
        <div class="stepper">
          <button type="button" class="stepper-btn" onclick="adjustStepper('repeatCount', 1, 1, 5, 0)">＋</button>
          <input type="text" id="input_repeatCount" class="stepper-display" readonly>
          <button type="button" class="stepper-btn" onclick="adjustStepper('repeatCount', -1, 1, 5, 0)">－</button>
        </div>
      </div>

      <!-- 3. 停頓時間倍率：[+按鈕] [inputbox] [-按鈕] (0.5 ~ 2.0, 幅度 0.1, 預設 1.0) -->
      <div class="stepper-group">
        <div class="stepper-label">
          <span>停頓時間倍率</span>
          <span style="color:var(--text-sub);">0.5 ~ 2.0x</span>
        </div>
        <div class="stepper">
          <button type="button" class="stepper-btn" onclick="adjustStepper('pauseMultiplier', 0.1, 0.5, 2.0, 1)">＋</button>
          <input type="text" id="input_pauseMultiplier" class="stepper-display" readonly>
          <button type="button" class="stepper-btn" onclick="adjustStepper('pauseMultiplier', -0.1, 0.5, 2.0, 1)">－</button>
        </div>
      </div>

      <button id="btnSaveSettings" class="btn" style="width:100%; margin-top:10px;" onclick="saveSettingsAndClose()">
        💾 儲存設定並關閉
      </button>
    </div>
  </div>

  <script>
    /**
     * ========================================================================
     * 全域狀態與預設值
     * ========================================================================
     */
    let serverState = {
      keyStatus: {},
      settings: {
        ttsVoice: 'en-HK-YanNeural',
        geminiModel: 'gemini-3.6-flash',
        playbackRate: 0.8,
        repeatCount: 2,
        pauseMultiplier: 1.0
      },
      pendingTask: null
    };

    let draftSettings = {}; // 系統設定視窗內的暫存值（儲存關閉時才同步雲端）
    let lessonsIndex = [];
    let currentLesson = null;
    let audioBlobUrls = {};

    // 雲端狀態機目前執行中的任務
    let activeTaskState = null;

    // 連續讀默播放狀態機
    let dictation = {
      isRunning: false,
      isPaused: false,
      chunkIdx: 0,
      pass: 1,
      timer: null
    };

    // iOS 靜音保活 AudioContext (防止等待默書期間 Safari 封鎖下一句播放)
    let keepAliveCtx = null;
    function ensureIosAudioKeepAlive() {
      try {
        if (!keepAliveCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          keepAliveCtx = new AudioCtx();
          const osc = keepAliveCtx.createOscillator();
          const gain = keepAliveCtx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(keepAliveCtx.destination);
          osc.start();
        }
        if (keepAliveCtx.state === 'suspended') keepAliveCtx.resume();
      } catch (e) {}
    }

    /**
     * ========================================================================
     * 初始化流程
     * ========================================================================
     */
    window.onload = async function() {
      populateModelSelects();
      await syncInitStateFromGAS();
      await loadCatalogFromGitHub();
    };

    function populateModelSelects() {
      document.getElementById('setVoiceSelect').innerHTML = APP_CONFIG.TTS_VOICES
        .map(v => `<option value="${v.id}">${v.label}</option>`).join('');
      document.getElementById('setGeminiSelect').innerHTML = APP_CONFIG.GEMINI_MODELS
        .map(m => `<option value="${m.id}">${m.label}</option>`).join('');
    }

    async function callGAS(action, payloadObj = {}) {
      const res = await fetch(APP_CONFIG.GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payloadObj })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || "GAS 執行錯誤");
      return json.data;
    }

    async function syncInitStateFromGAS() {
      try {
        const data = await callGAS('getInitState');
        serverState = data;
        refreshKeyAlertDot();
        applyBrowserPlaybackRate();

        // 若雲端有上次未完成的斷點任務，顯示接續提示橫幅
        if (data.pendingTask && data.pendingTask.status !== 'COMPLETED') {
          activeTaskState = data.pendingTask;
          document.getElementById('resumeLessonName').innerText = data.pendingTask.title;
          document.getElementById('cloudResumeBanner').style.display = 'block';
        }
      } catch (e) {
        console.error("連線 GAS 失敗:", e);
      }
    }

    function refreshKeyAlertDot() {
      const ks = serverState.keyStatus || {};
      const hasAnyTts = ks['GOOGLE_TTS_KEY'] || ks['AZURE_TTS_KEY'];
      const isReady = ks['GEMINI_API_KEY'] && ks['GITHUB_TOKEN'] && hasAnyTts;
      document.getElementById('keyMissingDot').style.display = isReady ? 'none' : 'block';
    }

    function applyBrowserPlaybackRate() {
      const player = document.getElementById('mainAudio');
      if (player) {
        player.playbackRate = Number(serverState.settings.playbackRate || 0.8);
      }
    }

    /**
     * ========================================================================
     * 畫面互斥收合控制 (1. 無課文直接進加入 / 2. 加入時隱藏播放 / 3. 播放時隱藏加入)
     * ========================================================================
     */
    function switchView(mode) {
      const viewAdd = document.getElementById('viewAddLesson');
      const viewPlay = document.getElementById('viewPlayer');
      const btnBack = document.getElementById('btnBackToPlayer');

      if (mode === 'ADD' || lessonsIndex.length === 0) {
        stopDictation();
        viewPlay.style.display = 'none';
        viewAdd.style.display = 'block';
        // 只有當已經有課文時，才顯示「返回播放」按鈕；若無課文則直接隱藏返回鈕
        btnBack.style.display = (lessonsIndex.length > 0) ? 'inline-flex' : 'none';
        resetAddFormUI();
      } else {
        viewAdd.style.display = 'none';
        viewPlay.style.display = 'block';
      }
    }

    // 防誤入錯資料：當選擇相片後隱藏文字框；當輸入文字時隱藏相片框
    function onImageSelected() {
      const fileInput = document.getElementById('ocrImageInput');
      const textBlock = document.getElementById('textInputBlock');
      const hint = document.getElementById('selectedImageHint');
      const nameSpan = document.getElementById('selectedImageName');

      if (fileInput.files && fileInput.files.length > 0) {
        textBlock.style.display = 'none';
        fileInput.style.display = 'none';
        nameSpan.innerText = "📷 " + fileInput.files[0].name;
        hint.style.display = 'flex';
      }
    }

    function clearSelectedImage() {
      const fileInput = document.getElementById('ocrImageInput');
      fileInput.value = '';
      fileInput.style.display = 'block';
      document.getElementById('selectedImageHint').style.display = 'none';
      document.getElementById('textInputBlock').style.display = 'block';
    }

    function onTextInputChanged() {
      const val = document.getElementById('newLessonText').value.trim();
      document.getElementById('imageInputBlock').style.display = (val.length > 0) ? 'none' : 'block';
    }

    function resetAddFormUI() {
      document.getElementById('addFormArea').style.display = 'block';
      document.getElementById('buildProgressArea').style.display = 'none';
      document.getElementById('btnResumeOnError').style.display = 'none';
      clearSelectedImage();
      document.getElementById('newLessonText').value = '';
      document.getElementById('imageInputBlock').style.display = 'block';
    }

    /**
     * ========================================================================
     * 方案 B：一鍵全自動流水線 + 雙存檔點斷點續傳
     * ========================================================================
     */
    function renderProgressUI(step, totalSteps, title, actionDesc, doneCount, totalCount) {
      document.getElementById('addFormArea').style.display = 'none';
      document.getElementById('btnBackToPlayer').style.display = 'none';
      document.getElementById('buildProgressArea').style.display = 'block';

      const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
      const remainCount = Math.max(0, totalCount - doneCount);

      document.getElementById('progStepPill').innerText = `Step ${step} / ${totalSteps}`;
      document.getElementById('progPercentText').innerText = `${pct}%`;
      document.getElementById('progTargetTitle').innerText = title;
      document.getElementById('progCurrentAction').innerText = actionDesc;
      document.getElementById('progBarFill').style.width = `${pct}%`;
      document.getElementById('progDoneStat').innerText = `已完成: ${doneCount}`;
      document.getElementById('progRemainStat').innerText = `尚餘未完成: ${remainCount}`;
    }

    async function startOneClickBuild() {
      const titleInput = document.getElementById('newLessonTitle').value.trim();
      const rawText = document.getElementById('newLessonText').value.trim();
      const fileInput = document.getElementById('ocrImageInput');

      if (!rawText && (!fileInput.files || fileInput.files.length === 0)) {
        alert("請拍攝/選取課本相片，或貼上英文課文文字！");
        return;
      }

      document.getElementById('btnResumeOnError').style.display = 'none';
      document.getElementById('cloudResumeBanner').style.display = 'none';

      try {
        let imageBase64 = null, imageMimeType = null;
        if (fileInput.files && fileInput.files.length > 0) {
          const f = fileInput.files[0];
          imageMimeType = f.type;
          imageBase64 = await fileToBase64(f);
        }

        // --- Step 1: Gemini OCR 與意群分拆 (完成後自動寫入雲端狀態機) ---
        renderProgressUI(1, 3, titleInput || "分析課文中...", "正在呼叫 Gemini 進行 OCR 及自然意群分拆...", 0, 1);

        activeTaskState = await callGAS('step1_analyzeAndPrepare', {
          payload: {
            title: titleInput,
            rawText: rawText,
            imageBase64: imageBase64,
            imageMimeType: imageMimeType,
            geminiModel: serverState.settings.geminiModel,
            voiceName: serverState.settings.ttsVoice
          }
        });

        // 進入 Step 2 & Step 3 自動流水線
        await continuePipelineFromCheckpoint();

      } catch (err) {
        handlePipelinePauseError(err.message);
      }
    }

    async function resumeFromCloudTask() {
      if (!activeTaskState) return;
      document.getElementById('cloudResumeBanner').style.display = 'none';
      switchView('ADD');
      await continuePipelineFromCheckpoint();
    }

    async function discardCloudTask() {
      document.getElementById('cloudResumeBanner').style.display = 'none';
      activeTaskState = null;
      await callGAS('discardPendingTask');
    }

    // 核心斷點續傳執行器：自動檢查哪些句子未完成 TTS 或 GitHub Blob
    async function continuePipelineFromCheckpoint() {
      if (!activeTaskState) return;
      document.getElementById('btnResumeOnError').style.display = 'none';

      try {
        const chunks = activeTaskState.chunks;
        const total = chunks.length;
        const batchSize = APP_CONFIG.TTS_BATCH_SIZE || 5;

        // --- Step 2 (方案 B): 每 5 句同批 TTS 存 Drive + 記憶體直傳 GitHub Blob ---
        for (let i = 0; i < total; i += batchSize) {
          const slice = chunks.slice(i, i + batchSize);
          // 檢查此批次是否全部皆已有 driveFileId 及 gitBlobSha
          const needsWork = slice.some(c => !c.driveFileId || !c.gitBlobSha);

          if (needsWork) {
            const doneSoFar = chunks.filter(c => c.driveFileId && c.gitBlobSha).length;
            const batchIndices = slice.map(c => c.index);

            renderProgressUI(
              2, 3,
              `課文：${activeTaskState.title}`,
              `正在處理第 ${batchIndices[0] + 1} ~ ${batchIndices[batchIndices.length - 1] + 1} 句 (TTS 下載存 Drive + 直傳 GitHub)...`,
              doneSoFar,
              total
            );

            const step2Res = await callGAS('step2_schemeB_batchTTSAndBlobs', {
              payload: {
                batchIndices: batchIndices,
                driveFolderId: activeTaskState.driveFolderId,
                ghConfig: APP_CONFIG.GITHUB
              }
            });

            // 同步更新前端持有的雲端狀態
            if (step2Res.updatedFullState) {
              activeTaskState = step2Res.updatedFullState;
            }

            if (!step2Res.batchSuccess) {
              throw new Error(step2Res.error || "批次上傳中斷");
            }
          }
        }

        // --- Step 3: 單次打包 Commit 至 GitHub-assets ---
        renderProgressUI(3, 3, `課文：${activeTaskState.title}`, "正在將全部 MP3 與 JSON 單次打包 Commit 至 GitHub...", total - 1, total);

        const step3Res = await callGAS('step3_commitToGitHub', {
          payload: {
            driveFolderId: activeTaskState.driveFolderId,
            ghConfig: APP_CONFIG.GITHUB
          }
        });

        renderProgressUI(3, 3, `課文：${activeTaskState.title}`, "✅ 完成！正在進入播放器...", total, total);

        lessonsIndex = step3Res.indexList;
        const newLessonId = step3Res.lesson.id;
        activeTaskState = null;
        document.getElementById('newLessonTitle').value = '';

        renderCatalogDropdown();
        switchView('PLAYER');
        await selectLesson(newLessonId);

      } catch (err) {
        handlePipelinePauseError(err.message);
      }
    }

    function handlePipelinePauseError(msg) {
      const doneTts = activeTaskState ? activeTaskState.chunks.filter(c => c.driveFileId).length : 0;
      const doneBlobs = activeTaskState ? activeTaskState.chunks.filter(c => c.gitBlobSha).length : 0;
      const total = activeTaskState ? activeTaskState.chunks.length : 0;

      document.getElementById('progCurrentAction').innerHTML =
        `<span style="color:var(--danger); font-weight:700;">❌ 中斷：${escapeHtml(msg)}</span><br>` +
        `<small>已安全保存存檔點：TTS 已完成 ${doneTts}/${total} 句 ｜ GitHub 已預傳 ${doneBlobs}/${total} 句</small>`;
      document.getElementById('btnResumeOnError').style.display = 'inline-flex';
      if (lessonsIndex.length > 0) {
        document.getElementById('btnBackToPlayer').style.display = 'inline-flex';
      }
    }

    /**
     * ========================================================================
     * 課文目錄與三層極速音檔讀取 (GitHub CDN -> Drive -> 即時 TTS)
     * ========================================================================
     */
    function getRawUrl(path) {
      const { owner, assetsRepo, branch } = APP_CONFIG.GITHUB;
      return `https://raw.githubusercontent.com/${owner}/${assetsRepo}/${branch}/${path}?t=${Date.now()}`;
    }

    function getCdnUrl(path) {
      const { owner, assetsRepo, branch } = APP_CONFIG.GITHUB;
      return `https://cdn.jsdelivr.net/gh/${owner}/${assetsRepo}@${branch}/${path}`;
    }

    async function loadCatalogFromGitHub() {
      try {
        const res = await fetch(getRawUrl('lessons/index.json'));
        lessonsIndex = res.ok ? await res.json() : [];
      } catch (e) {
        lessonsIndex = [];
      }

      if (lessonsIndex.length === 0) {
        // 1. 課文目錄如沒有，直接隱藏並出現 2. 加入課文
        switchView('ADD');
      } else {
        renderCatalogDropdown();
        switchView('PLAYER');
        await selectLesson(lessonsIndex[0].id);
      }
    }

    function renderCatalogDropdown() {
      const sel = document.getElementById('lessonDropdown');
      sel.innerHTML = lessonsIndex.map(item => `
        <option value="${item.id}" ${currentLesson && currentLesson.id === item.id ? 'selected' : ''}>
          ${escapeHtml(item.title)} (${item.chunkCount}組)
        </option>
      `).join('');
    }

    async function selectLesson(lessonId) {
      stopDictation();
      const banner = document.getElementById('playerBanner');
      banner.innerText = "⏳ 正在檢查並載入音檔...";
      document.getElementById('btnPlay').disabled = true;

      try {
        const res = await fetch(getRawUrl(`lessons/lesson_${lessonId}.json`));
        if (!res.ok) throw new Error("無法讀取課文 JSON");
        currentLesson = await res.json();

        renderCatalogDropdown();
        renderChunks();

        Object.values(audioBlobUrls).forEach(u => URL.revokeObjectURL(u));
        audioBlobUrls = {};

        let loaded = 0;
        const total = currentLesson.chunks.length;

        // 並行檢查每句 MP3：GitHub-assets 有就直讀，無就找 Google Drive，最後才 Call TTS
        await Promise.all(currentLesson.chunks.map(async (chunk) => {
          let blobUrl = null;
          try {
            const r = await fetch(getCdnUrl(chunk.audioPath));
            if (r.ok) {
              const b = await r.blob();
              blobUrl = URL.createObjectURL(b);
            }
          } catch (e) {}

          if (!blobUrl) {
            const fb = await callGAS('fallbackGetAudio', {
              payload: {
                lessonTitle: currentLesson.title,
                voiceName: currentLesson.voiceName,
                chunk: chunk
              }
            });
            blobUrl = fb.audioData;
          }

          audioBlobUrls[chunk.index] = blobUrl;
          loaded++;
          banner.innerText = `⚡ 載入音檔中 (${loaded}/${total})...`;
        }));

        banner.innerText = `✅ 已準備就緒 (共 ${total} 組)`;
        document.getElementById('btnPlay').disabled = false;
        document.getElementById('btnReplay').disabled = false;

      } catch (err) {
        banner.innerText = "❌ 載入失敗: " + err.message;
      }
    }

    function renderChunks() {
      const cont = document.getElementById('chunkListContainer');
      if (!currentLesson) { cont.innerHTML = ''; return; }

      const isMasked = document.getElementById('maskTextCheckbox').checked;
      const mult = Number(serverState.settings.pauseMultiplier || 1.0);

      cont.innerHTML = currentLesson.chunks.map((c, idx) => {
        const waitSec = Math.max(1, Math.round(c.pauseSeconds * mult));
        const isActive = dictation.isRunning && dictation.chunkIdx === idx;
        return `
          <div id="chunk_row_${idx}" class="chunk-card ${isActive ? 'active' : ''}" onclick="playSinglePreview(${idx})">
            <span class="chunk-text ${isMasked ? 'masked' : ''}">${idx + 1}. ${escapeHtml(c.text)}</span>
            <span class="chunk-badge">停 ${waitSec}s</span>
          </div>
        `;
      }).join('');
    }

    async function deleteCurrentLesson() {
      if (!currentLesson) return;
      if (!confirm(`確定要刪除「${currentLesson.title}」嗎？\n(Google Drive 內的 MP3 備份不會被刪除)`)) return;

      document.getElementById('playerBanner').innerText = "🗑️ 正在刪除課文...";
      try {
        const res = await callGAS('deleteLesson', {
          payload: { lessonId: currentLesson.id, ghConfig: APP_CONFIG.GITHUB }
        });
        lessonsIndex = res.indexList;
        currentLesson = null;
        if (lessonsIndex.length === 0) {
          switchView('ADD');
        } else {
          renderCatalogDropdown();
          await selectLesson(lessonsIndex[0].id);
        }
      } catch (e) {
        alert("刪除失敗: " + e.message);
      }
    }

    /**
     * ========================================================================
     * iOS 連續讀默播放引擎 (瀏覽器即時控制語速)
     * ========================================================================
     */
    function playSinglePreview(idx) {
      if (!currentLesson || !audioBlobUrls[idx]) return;
      stopDictation();
      ensureIosAudioKeepAlive();

      dictation.chunkIdx = idx;
      highlightActiveChunk(idx);

      const player = document.getElementById('mainAudio');
      player.src = audioBlobUrls[idx];
      player.playbackRate = Number(serverState.settings.playbackRate || 0.8);
      player.onended = null;
      player.play();
      document.getElementById('playerBanner').innerText = `🔊 單句預覽：第 ${idx + 1} 組`;
    }

    function startOrResumeDictation() {
      if (!currentLesson) return;
      ensureIosAudioKeepAlive();

      if (dictation.isRunning && dictation.isPaused) {
        dictation.isPaused = false;
        document.getElementById('btnPlay').disabled = true;
        document.getElementById('btnPause').disabled = false;
        runDictationCycle();
        return;
      }

      dictation.isRunning = true;
      dictation.isPaused = false;
      dictation.chunkIdx = 0;
      dictation.pass = 1;

      document.getElementById('btnPlay').disabled = true;
      document.getElementById('btnPause').disabled = false;
      document.getElementById('btnStop').disabled = false;

      runDictationCycle();
    }

    function runDictationCycle() {
      if (!dictation.isRunning || dictation.isPaused || !currentLesson) return;

      const idx = dictation.chunkIdx;
      const total = currentLesson.chunks.length;
      const maxPasses = Number(serverState.settings.repeatCount || 2);

      if (idx >= total) {
        stopDictation();
        document.getElementById('playerBanner').innerText = "🎉 全篇讀默完成！";
        return;
      }

      const chunk = currentLesson.chunks[idx];
      highlightActiveChunk(idx);

      const banner = document.getElementById('playerBanner');
      banner.innerText = `🔊 第 ${idx + 1}/${total} 組 (第 ${dictation.pass}/${maxPasses} 次)`;

      const player = document.getElementById('mainAudio');
      player.src = audioBlobUrls[idx];
      player.playbackRate = Number(serverState.settings.playbackRate || 0.8);

      player.onended = () => {
        if (!dictation.isRunning || dictation.isPaused) return;

        const mult = Number(serverState.settings.pauseMultiplier || 1.0);
        let remain = Math.max(1, Math.round(chunk.pauseSeconds * mult));
        banner.innerText = `✍️ 默寫停頓中... (${remain} 秒)`;

        clearInterval(dictation.timer);
        dictation.timer = setInterval(() => {
          if (dictation.isPaused || !dictation.isRunning) {
            clearInterval(dictation.timer);
            return;
          }
          remain--;
          if (remain > 0) {
            banner.innerText = `✍️ 默寫停頓中... (${remain} 秒)`;
          } else {
            clearInterval(dictation.timer);
            if (dictation.pass < maxPasses) {
              dictation.pass++;
            } else {
              dictation.chunkIdx++;
              dictation.pass = 1;
            }
            runDictationCycle();
          }
        }, 1000);
      };

      player.play().catch(() => {
        banner.innerText = "⚠️ 請點擊「繼續」解鎖 iOS 播放";
        pauseDictation();
      });
    }

    function pauseDictation() {
      if (!dictation.isRunning) return;
      dictation.isPaused = true;
      clearInterval(dictation.timer);
      document.getElementById('mainAudio').pause();

      const btn = document.getElementById('btnPlay');
      btn.innerText = "▶ 繼續";
      btn.disabled = false;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('playerBanner').innerText = "⏸ 已暫停";
    }

    function stopDictation() {
      dictation.isRunning = false;
      dictation.isPaused = false;
      clearInterval(dictation.timer);

      const player = document.getElementById('mainAudio');
      player.pause();
      player.onended = null;

      const btn = document.getElementById('btnPlay');
      btn.innerText = "▶ 開始讀默";
      btn.disabled = !currentLesson;
      document.getElementById('btnPause').disabled = true;
      document.getElementById('btnStop').disabled = true;
      highlightActiveChunk(-1);
    }

    function replayCurrentChunk() {
      if (!currentLesson) return;
      clearInterval(dictation.timer);
      if (dictation.isRunning) {
        dictation.isPaused = false;
        runDictationCycle();
      } else {
        playSinglePreview(dictation.chunkIdx || 0);
      }
    }

    function highlightActiveChunk(activeIdx) {
      if (!currentLesson) return;
      currentLesson.chunks.forEach((_, i) => {
        const el = document.getElementById(`chunk_row_${i}`);
        if (el) {
          if (i === activeIdx) {
            el.classList.add('active');
            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    /**
     * ========================================================================
     * 左上：Key 設定 Modal
     * - 已設定：Badge 在下一行，不顯示 inputbox，點擊才展開
     * - 未設定：[⚠️ 尚未設定] 與標題同行，正下方直接顯示 inputbox
     * ========================================================================
     */
    function openKeyModal() {
      const keyDefs = [
        { id: 'GEMINI_API_KEY', name: 'Gemini API Key' },
        { id: 'GOOGLE_TTS_KEY', name: 'Google Cloud TTS Key' },
        { id: 'AZURE_TTS_KEY', name: 'Microsoft Azure TTS Key' },
        { id: 'GITHUB_TOKEN', name: 'GitHub Personal Token' }
      ];

      const container = document.getElementById('keyItemsContainer');
      container.innerHTML = keyDefs.map(k => {
        const isSet = Boolean(serverState.keyStatus && serverState.keyStatus[k.id]);
        if (isSet) {
          // 已設定好：Badge 改為下一行，無需顯示 inputbox，點擊才顯示
          return `
            <div class="key-item">
              <div class="key-title">${k.name}</div>
              <div class="key-nextline-badge" onclick="toggleKeyInputBox('${k.id}')">
                <span class="badge-tag ok">✅ 已設定 (點擊修改)</span>
              </div>
              <div id="key_wrap_${k.id}" style="display:none; margin-top:8px;">
                <input type="password" id="key_input_${k.id}" placeholder="輸入新金鑰以覆蓋原有設定">
              </div>
            </div>
          `;
        } else {
          // 尚未設定：Badge 與標題一行過，下面直接有 inputbox
          return `
            <div class="key-item">
              <div class="key-row-inline">
                <span class="key-title">${k.name}</span>
                <span class="badge-tag warn">⚠️ 尚未設定</span>
              </div>
              <div style="margin-top:8px;">
                <input type="password" id="key_input_${k.id}" placeholder="請貼上 ${k.name}">
              </div>
            </div>
          `;
        }
      }).join('');

      openModal('keyModal');
    }

    function toggleKeyInputBox(keyId) {
      const wrap = document.getElementById(`key_wrap_${keyId}`);
      if (!wrap) return;
      const isHidden = wrap.style.display === 'none';
      wrap.style.display = isHidden ? 'block' : 'none';
      if (isHidden) {
        const inp = document.getElementById(`key_input_${keyId}`);
        if (inp) inp.focus();
      }
    }

    async function submitKeys() {
      const btn = document.getElementById('btnSaveKeys');
      btn.disabled = true;
      btn.innerText = "儲存中...";

      const keys = {};
      ['GEMINI_API_KEY', 'GOOGLE_TTS_KEY', 'AZURE_TTS_KEY', 'GITHUB_TOKEN'].forEach(k => {
        const el = document.getElementById(`key_input_${k}`);
        if (el && el.value.trim() !== '') {
          keys[k] = el.value.trim();
        }
      });

      try {
        const data = await callGAS('saveKeys', { keys });
        serverState = data;
        refreshKeyAlertDot();
        closeModal('keyModal');
      } catch (e) {
        alert("儲存失敗: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "💾 儲存金鑰";
      }
    }

    /**
     * ========================================================================
     * 右上：系統設定 Modal ([+按鈕][inputbox][-按鈕]，儲存關閉時才同步雲端)
     * ========================================================================
     */
    function openSettingsModal() {
      draftSettings = {
        ttsVoice: serverState.settings.ttsVoice || 'en-HK-YanNeural',
        geminiModel: serverState.settings.geminiModel || 'gemini-3.6-flash',
        playbackRate: Number(serverState.settings.playbackRate || 0.8),
        repeatCount: Number(serverState.settings.repeatCount || 2),
        pauseMultiplier: Number(serverState.settings.pauseMultiplier || 1.0)
      };

      document.getElementById('setVoiceSelect').value = draftSettings.ttsVoice;
      document.getElementById('setGeminiSelect').value = draftSettings.geminiModel;

      refreshStepperDisplay('playbackRate', 2);
      refreshStepperDisplay('repeatCount', 0);
      refreshStepperDisplay('pauseMultiplier', 1);

      openModal('settingsModal');
    }

    function adjustStepper(field, delta, minVal, maxVal, decimals) {
      let nextVal = Number(draftSettings[field]) + delta;
      if (nextVal < minVal) nextVal = minVal;
      if (nextVal > maxVal) nextVal = maxVal;
      draftSettings[field] = Number(nextVal.toFixed(decimals));
      refreshStepperDisplay(field, decimals);
    }

    function refreshStepperDisplay(field, decimals) {
      const el = document.getElementById(`input_${field}`);
      if (el) {
        el.value = decimals > 0 ? Number(draftSettings[field]).toFixed(decimals) : String(draftSettings[field]);
      }
    }

    async function saveSettingsAndClose() {
      const btn = document.getElementById('btnSaveSettings');
      btn.disabled = true;
      btn.innerText = "同步至雲端中...";

      draftSettings.ttsVoice = document.getElementById('setVoiceSelect').value;
      draftSettings.geminiModel = document.getElementById('setGeminiSelect').value;

      // 先即時套用至本地與瀏覽器播放器，再同步至 GAS 雲端並關閉視窗
      serverState.settings = { ...draftSettings };
      applyBrowserPlaybackRate();
      renderChunks();

      try {
        const data = await callGAS('saveSettings', { settings: draftSettings });
        serverState = data;
        closeModal('settingsModal');
      } catch (e) {
        alert("儲存設定失敗: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "💾 儲存設定並關閉";
      }
    }

    /**
     * ========================================================================
     * 通用工具函數
     * ========================================================================
     */
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[s]));
    }
  </script>
