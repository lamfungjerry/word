<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英語單字學習系統</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="config.js"></script>
  <script>
    if (window.CONFIG && window.CONFIG.ICON_URL) {
      document.write('<link rel="apple-touch-icon" href="' + window.CONFIG.ICON_URL + '">');
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-16 font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900 shadow-md sticky top-0 z-50 pt-safe">
    <div class="max-w-4xl mx-auto px-3 pt-2 pb-1 flex flex-col space-y-1">
      <div class="flex justify-between items-center px-1">
        <div class="flex items-center space-x-2">
          <button onclick="window.openKeyModal()" class="text-lg hover:scale-110 transition p-1" title="API 金鑰">🔑</button>
          <h1 class="text-white text-base md:text-lg font-bold py-1 cursor-pointer select-none active:opacity-70" onclick="window.safeBack()">英語單字學習系統</h1>
        </div>
        <div class="flex items-center space-x-2">
          <div id="sync-status" class="text-xs md:text-sm font-bold text-emerald-400 flex items-center bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700">
            <span class="hourglass-spin">⏳</span> <span class="ml-1">載入中...</span>
          </div>
          <button onclick="window.openVoiceModal()" class="text-lg p-1">⚙️</button>
        </div>
      </div>
      <nav id="main-nav" class="flex justify-between gap-2 pb-1 pt-1">
        <button id="nav-quiz" onclick="window.switchTab('quiz')" class="nav-btn flex-1 py-1.5 rounded-lg text-sm md:text-base font-bold bg-amber-500 text-slate-900 shadow-sm">✏️ 開始測驗</button>
        <button id="nav-topics" onclick="window.switchTab('topics')" class="nav-btn flex-1 py-1.5 rounded-lg text-sm md:text-base font-bold bg-slate-700 text-white shadow-sm">📚 課題管理</button>
        <button id="nav-analytics" onclick="window.switchTab('analytics')" class="nav-btn flex-1 py-1.5 rounded-lg text-sm md:text-base font-bold bg-slate-700 text-white shadow-sm">📊 學習歷程</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 md:px-4 pt-3 pb-6">
    <!-- 測驗分頁 -->
    <section id="tab-quiz">
      <div id="quiz-setup" class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200 mb-3">
        <div class="mb-5">
          <label class="block text-base font-bold text-slate-700 mb-2">📚 選擇測驗課題</label>
          <select id="topic-select" onchange="window.onTopicSelectChange()" class="w-full p-3 border-2 border-slate-200 rounded-xl focus:ring focus:ring-amber-200 bg-slate-50 font-bold text-base outline-none">
            <option value="">載入課題中...</option>
          </select>
        </div>
        <div class="mb-6">
          <label class="block text-base font-bold text-slate-700 mb-3">🎯 選擇測驗模式</label>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <label class="relative cursor-pointer">
              <input type="radio" name="quizMode" value="view" class="peer sr-only" checked>
              <div class="p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-slate-50 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 transition-all flex flex-col h-full shadow-sm">
                <div class="flex items-center space-x-2 mb-1"><span class="text-2xl">👁️</span><span class="font-bold text-indigo-900 text-base">瀏覽模式</span></div>
                <p class="text-xs text-slate-500 font-medium mt-1">純顯示圖片與發音。適合手寫。</p>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="quizMode" value="type" class="peer sr-only">
              <div class="p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-slate-50 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 transition-all flex flex-col h-full shadow-sm">
                <div class="flex items-center space-x-2 mb-1"><span class="text-2xl">⌨️</span><span class="font-bold text-indigo-900 text-base">打字模式</span></div>
                <p class="text-xs text-slate-500 font-medium mt-1">虛擬鍵盤拼寫，紀錄成績。</p>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="quizMode" value="mc" class="peer sr-only">
              <div class="p-4 rounded-xl border-2 border-slate-200 bg-white hover:bg-slate-50 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 transition-all flex flex-col h-full shadow-sm">
                <div class="flex items-center space-x-2 mb-1"><span class="text-2xl">🎲</span><span class="font-bold text-emerald-800 text-base">溫習模式</span></div>
                <p class="text-xs text-slate-500 font-medium mt-1">四選一選擇題。快速無壓力。</p>
              </div>
            </label>
          </div>
        </div>
        <button id="start-quiz-btn" onclick="window.startQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 md:py-4 rounded-xl shadow-md text-lg active:bg-emerald-800">▶️ 開始測驗</button>
      </div>

      <div id="quiz-active" class="hidden space-y-2">
        <div class="flex justify-between items-center font-bold text-slate-700 bg-white p-2.5 rounded-lg shadow-sm border border-slate-200">
          <div class="flex items-center space-x-3 text-sm">
            <span>進度: <span id="q-progress" class="text-amber-600">1/10</span></span>
            <span id="score-container" class="hidden">得分: <span id="q-score" class="text-emerald-600">0</span></span>
          </div>
          <button onclick="window.cancelQuiz()" class="text-red-500 font-bold px-3 py-1 bg-red-50 rounded-lg text-xs border border-red-200">✖ 取消</button>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
          <div class="w-full relative flex flex-col justify-center bg-slate-100 p-2 rounded-lg mb-3">
            <div class="absolute top-2 right-2 flex flex-col space-y-1 opacity-70 hover:opacity-100 transition z-10">
              <button onclick="window.changeImageHeight(24)" class="bg-white border shadow-sm w-8 h-8 rounded text-lg font-bold">➕</button>
              <button onclick="window.changeImageHeight(-24)" class="bg-white border shadow-sm w-8 h-8 rounded text-lg font-bold">➖</button>
            </div>
            <canvas id="word-canvas" class="w-full object-contain p-1 rounded bg-white shadow-sm border border-slate-200 transition-all duration-200" style="height: 344px;"></canvas>
          </div>
          
          <button id="quiz-play-btn" onclick="window.playCurrentQuizWord()" class="btn-play-ready font-bold px-8 py-3 rounded-full flex items-center space-x-2 mb-4 shadow-md text-lg active:scale-95"><span>▶️ 播放</span></button>
          
          <div id="view-mode-ui" class="w-full flex gap-3 hidden">
            <button onclick="window.prevQuestion()" class="flex-1 bg-slate-200 text-slate-800 font-bold py-3 rounded-xl">⬅️ 上一題</button>
            <button onclick="window.nextQuestion()" id="view-next-btn" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md">下一題 ➡️</button>
          </div>
          
          <div id="mc-mode-ui" class="w-full grid gap-2.5 hidden">
            <button class="mc-btn w-full py-3.5 px-2 rounded-xl border-2 border-slate-300 font-bold text-base md:text-lg text-slate-800 bg-white shadow-sm flex items-center justify-center text-center"></button>
            <button class="mc-btn w-full py-3.5 px-2 rounded-xl border-2 border-slate-300 font-bold text-base md:text-lg text-slate-800 bg-white shadow-sm flex items-center justify-center text-center"></button>
            <button class="mc-btn w-full py-3.5 px-2 rounded-xl border-2 border-slate-300 font-bold text-base md:text-lg text-slate-800 bg-white shadow-sm flex items-center justify-center text-center"></button>
            <button class="mc-btn w-full py-3.5 px-2 rounded-xl border-2 border-slate-300 font-bold text-base md:text-lg text-slate-800 bg-white shadow-sm flex items-center justify-center text-center"></button>
          </div>
          
          <div id="type-mode-ui" class="w-full max-w-xl hidden flex-col items-center">
            <div id="fake-answer-input" class="w-full p-3 border-2 border-slate-300 rounded-xl bg-slate-50 text-xl font-bold text-center h-12 flex items-center justify-center tracking-widest fake-cursor shadow-inner"></div>
            <div class="w-full mt-3 bg-slate-100 p-2 md:p-3 rounded-xl flex flex-col gap-1.5 shadow-inner">
              <div class="flex gap-1 justify-center">
                <button onclick="window.handleVK('q')" class="vk-btn">q</button><button onclick="window.handleVK('w')" class="vk-btn">w</button>
                <button onclick="window.handleVK('e')" class="vk-btn">e</button><button onclick="window.handleVK('r')" class="vk-btn">r</button>
                <button onclick="window.handleVK('t')" class="vk-btn">t</button><button onclick="window.handleVK('y')" class="vk-btn">y</button>
                <button onclick="window.handleVK('u')" class="vk-btn">u</button><button onclick="window.handleVK('i')" class="vk-btn">i</button>
                <button onclick="window.handleVK('o')" class="vk-btn">o</button><button onclick="window.handleVK('p')" class="vk-btn">p</button>
              </div>
              <div class="flex gap-1 justify-center px-4 md:px-6">
                <button onclick="window.handleVK('a')" class="vk-btn">a</button><button onclick="window.handleVK('s')" class="vk-btn">s</button>
                <button onclick="window.handleVK('d')" class="vk-btn">d</button><button onclick="window.handleVK('f')" class="vk-btn">f</button>
                <button onclick="window.handleVK('g')" class="vk-btn">g</button><button onclick="window.handleVK('h')" class="vk-btn">h</button>
                <button onclick="window.handleVK('j')" class="vk-btn">j</button><button onclick="window.handleVK('k')" class="vk-btn">k</button>
                <button onclick="window.handleVK('l')" class="vk-btn">l</button>
              </div>
              <div class="flex gap-1 justify-center">
                <button onclick="window.handleVK('DEL')" class="vk-btn vk-btn-wide text-red-600">⌫</button>
                <button onclick="window.handleVK('z')" class="vk-btn">z</button><button onclick="window.handleVK('x')" class="vk-btn">x</button>
                <button onclick="window.handleVK('c')" class="vk-btn">c</button><button onclick="window.handleVK('v')" class="vk-btn">v</button>
                <button onclick="window.handleVK('b')" class="vk-btn">b</button><button onclick="window.handleVK('n')" class="vk-btn">n</button>
                <button onclick="window.handleVK('m')" class="vk-btn">m</button>
                <button onclick="window.handleVK('ENTER')" class="vk-btn vk-btn-wide bg-emerald-100 text-emerald-800">↵</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 課題管理分頁 -->
    <section id="tab-topics" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base md:text-lg font-bold mb-3">📸 新增課題 (AI 自動切割)</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">AI 引擎</label>
            <select id="ai-model-select" class="w-full p-2.5 border rounded-lg bg-slate-50 text-sm font-bold outline-none">
              <option value="">載入中...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">上傳圖片</label>
            <input type="file" id="new-topic-img" accept="image/png, image/jpeg" class="w-full text-sm border p-1.5 rounded-lg bg-slate-50">
          </div>
          <button onclick="window.uploadTopic()" id="upload-btn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md active:bg-indigo-700">🚀 分析圖片並建立</button>
          <div id="upload-status" class="text-xs font-bold text-amber-600 text-center whitespace-pre-wrap"></div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base md:text-lg font-bold mb-3">📚 已有課題</h2>
        <ul id="topic-list-ul" class="space-y-2 text-sm max-h-[50vh] overflow-y-auto pr-1"></ul>
      </div>
    </section>

    <!-- 學習歷程分頁 -->
    <section id="tab-analytics" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-3">學生測驗紀錄</h2>
        <div class="mb-4">
          <select id="record-filter" onchange="window.renderRecords(this.value)" class="w-full p-2.5 border border-slate-300 rounded-lg bg-slate-50 font-medium text-sm outline-none"></select>
        </div>
        <div id="records-list" class="space-y-3 max-h-[60vh] overflow-y-auto pr-1 pb-4"></div>
      </div>
    </section>
  </main>

  <!-- Modals -->
  <div id="grid-editor-modal" class="fixed inset-0 bg-slate-100 z-[70] hidden flex-col">
    <div class="bg-white p-2.5 flex justify-between items-center shadow-sm shrink-0 border-b pt-safe">
      <button onclick="window.closeGridEditor()" class="text-red-500 font-bold px-3 py-1.5 bg-red-50 rounded-lg text-sm border border-red-200">✖ 取消</button>
      <input type="text" id="grid-topic-name" class="flex-1 mx-3 p-1.5 text-center font-bold text-base border-b-2 border-indigo-300 focus:border-indigo-600 bg-transparent outline-none rounded-none" placeholder="輸入課題名稱">
      <button onclick="window.saveGridEditor()" id="grid-save-btn" class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-bold text-sm shadow-md active:bg-emerald-700">💾 儲存</button>
    </div>
    <div class="flex-1 overflow-y-auto p-3"><div class="grid grid-cols-2 gap-3 pb-6" id="grid-cards-container"></div></div>
  </div>

  <div id="single-edit-modal" class="fixed inset-0 bg-slate-900/60 z-[80] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-xs rounded-2xl p-5 flex flex-col items-center shadow-2xl">
      <h3 class="font-bold text-sm text-slate-500 mb-3">修改生字 (<span id="single-edit-idx"></span>)</h3>
      <canvas id="single-edit-canvas" class="w-full h-32 object-contain bg-slate-100 rounded border border-slate-200 mb-4"></canvas>
      <input type="text" id="single-edit-input" class="w-full p-3 border-2 border-indigo-300 rounded-xl text-center font-bold text-xl outline-none focus:border-indigo-500 mb-5">
      <button onclick="window.confirmSingleEdit()" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl text-base shadow-md">確定修改</button>
    </div>
  </div>

  <div id="key-modal" class="fixed inset-0 bg-slate-900/60 z-[90] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-lg font-bold text-slate-800">🔑 系統金鑰設定</h3>
        <button onclick="window.closeKeyModal()" class="text-slate-400 font-bold text-lg">✖</button>
      </div>
      <div class="space-y-3 text-sm">
        <div id="row-gemini" class="p-3 rounded-xl border border-slate-200 bg-slate-50">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-700 text-xs">Gemini API Key</span>
            <div class="flex items-center space-x-2"><span id="status-gemini" class="text-xs font-bold"></span><button id="btn-edit-gemini" onclick="window.toggleKeyEdit('gemini')" class="text-xs font-bold text-indigo-600 hidden px-1 py-0.5">修改</button></div>
          </div>
          <div id="wrap-input-gemini" class="mt-2 hidden"><input type="password" id="input-gemini-key" class="w-full p-2 border rounded-lg text-xs bg-white"></div>
        </div>
        <div id="row-gcptts" class="p-3 rounded-xl border border-slate-200 bg-slate-50">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-700 text-xs">Google Cloud TTS Key</span>
            <div class="flex items-center space-x-2"><span id="status-gcptts" class="text-xs font-bold"></span><button id="btn-edit-gcptts" onclick="window.toggleKeyEdit('gcptts')" class="text-xs font-bold text-indigo-600 hidden px-1 py-0.5">修改</button></div>
          </div>
          <div id="wrap-input-gcptts" class="mt-2 hidden"><input type="password" id="input-gcptts-key" class="w-full p-2 border rounded-lg text-xs bg-white"></div>
        </div>
        <div id="row-github" class="p-3 rounded-xl border border-slate-200 bg-slate-50">
          <div class="flex justify-between items-center">
            <span class="font-bold text-slate-700 text-xs">GitHub Token</span>
            <div class="flex items-center space-x-2"><span id="status-github" class="text-xs font-bold"></span><button id="btn-edit-github" onclick="window.toggleKeyEdit('github')" class="text-xs font-bold text-indigo-600 hidden px-1 py-0.5">修改</button></div>
          </div>
          <div id="wrap-input-github" class="mt-2 hidden"><input type="password" id="input-github-token" class="w-full p-2 border rounded-lg text-xs bg-white"></div>
        </div>
      </div>
      <button onclick="window.saveAllKeys()" id="save-keys-btn" class="w-full mt-4 bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-sm">💾 儲存設定</button>
    </div>
  </div>

  <div id="voice-modal" class="fixed inset-0 bg-slate-900/60 z-[90] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5">
      <h3 class="text-base font-bold mb-3">⚙️ 測驗發音設定</h3>
      <select id="voice-select" onchange="window.onVoiceChange()" class="w-full p-3 border-2 border-slate-200 rounded-xl font-bold text-sm bg-slate-50 outline-none"></select>
      <button onclick="document.getElementById('voice-modal').classList.add('hidden')" class="w-full mt-5 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow">完成</button>
    </div>
  </div>

  <div id="audio-inspect-modal" class="fixed inset-0 bg-slate-900/60 z-[85] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
        <div><h3 class="text-base font-bold text-slate-800">🎧 音檔下載狀態</h3><p id="inspect-topic-title" class="text-xs text-indigo-600 font-bold truncate max-w-[200px]"></p></div>
        <button onclick="window.closeAudioInspectModal()" class="text-slate-400 font-bold text-lg p-1">✖</button>
      </div>
      <div id="inspect-content-list" class="flex-1 overflow-y-auto space-y-3 py-2 pr-1 text-xs"></div>
      <div class="pt-3 border-t border-slate-100 flex gap-2">
        <button id="btn-heal-audio" onclick="window.healMissingAudio()" class="flex-1 bg-amber-500 text-white font-bold py-2.5 rounded-xl text-xs">⚡ 自動補齊缺漏</button>
        <button onclick="window.closeAudioInspectModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold py-2.5 rounded-xl text-xs">關閉</button>
      </div>
    </div>
  </div>

  <div id="download-controller" class="floating-dl-wrapper collapsed" style="display:none;">
    <div class="floating-dl-toggle" onclick="window.openDownloadBar(event)"><span class="hourglass-spin">⏳</span></div>
    <div class="floating-dl-content" onclick="window.closeDownloadBar(event)">
      <span class="hourglass-spin text-sm">⏳</span><span id="dl-detail-text" class="text-xs font-bold text-slate-800 whitespace-nowrap">準備中...</span>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 -->
  <script>
    // ----------------------------------------------------
    // 系統安全驗證與初始化
    // ----------------------------------------------------
    window.safeBack = function() {
      if (document.referrer && document.referrer.startsWith(window.location.origin)) { history.back(); }
    };

    function showFatalError(msg) {
      alert('❌ ' + msg);
      var banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:12px;font-weight:bold;font-size:14px;z-index:99999;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
      banner.innerText = msg;
      document.body.appendChild(banner);
    }

    function checkRequiredConfig() {
      if (!window.CONFIG) { showFatalError('系統錯誤：找不到 config.js 檔案！'); return false; }
      var requiredKeys = ['GAS_URL', 'GITHUB_REPO', 'GITHUB_BRANCH', 'VOICE_MODELS', 'DEFAULT_VOICE', 'IMAGE_SETTINGS', 'GEMINI_DEFAULT_MODEL', 'GEMINI_EXCLUDE_KEYWORDS'];
      for (var i = 0; i < requiredKeys.length; i++) {
        var key = requiredKeys[i];
        if (window.CONFIG[key] === undefined || window.CONFIG[key] === null || window.CONFIG[key] === '') {
          showFatalError('config.js 錯誤：缺少欄位 [' + key + ']'); return false;
        }
      }
      if (!window.CONFIG.GEMINI_DEFAULT_MODEL || !window.CONFIG.GEMINI_DEFAULT_MODEL.id) {
        showFatalError('config.js 錯誤：GEMINI_DEFAULT_MODEL 必須包含 id 屬性'); return false;
      }
      return true;
    }

    window.globalData = { topics: [], records: [], lessonCache: {}, commitSha: localStorage.getItem('latestCommitSha') || '' };
    var audioState = {};
    var syncEngine = { queue: [], active: false, commitBatch: [], totalInQueue: 0, initialPayload: null };
    var gridEditorState = { isNew: true, topicId: '', items: [], imgObj: null, base64: '' };
    var activeEditIdx = -1, currentAudioPlayer = null;
    var currentQuestions = [], currentIndex = 0, currentScore = 0, currentTopicId = '', currentTopicName = '', mistakes = [];
    var currentQuizMode = 'view', currentTypedAnswer = '', currentMcChoices = [];
    var quizImgHeight = localStorage.getItem('quizImgHeight') ? parseInt(localStorage.getItem('quizImgHeight'), 10) : 344;

    function getCleanWord(word) { return (word || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
    function getTopicBase(topicId) { return 'topics/' + topicId; }
    
    function getTopicDataUrl(topicId) {
      return 'https://raw.githubusercontent.com/' + window.CONFIG.GITHUB_REPO + '/' + window.globalData.commitSha + '/' + getTopicBase(topicId) + '/data.json';
    }
    function getTopicImageUrl(topicId) {
      return 'https://raw.githubusercontent.com/' + window.CONFIG.GITHUB_REPO + '/' + window.globalData.commitSha + '/' + getTopicBase(topicId) + '/image.jpg';
    }
    
    // ⭐ 最新極簡檔名邏輯：無 MD5，直接 {cleanWord}.mp3
    function getAudioPath(topicId, voiceName, word) {
      return getTopicBase(topicId) + '/' + voiceName + '/' + getCleanWord(word) + '.mp3';
    }
    function getAudioRawUrl(topicId, voiceName, word) {
      return 'https://raw.githubusercontent.com/' + window.CONFIG.GITHUB_REPO + '/' + window.globalData.commitSha + '/' + getAudioPath(topicId, voiceName, word);
    }

    function ensureTopicDetailLoaded(topicId) {
      if (window.globalData.lessonCache[topicId] && window.globalData.lessonCache[topicId].items) {
        return Promise.resolve(window.globalData.lessonCache[topicId]);
      }
      return fetch(getTopicDataUrl(topicId), { cache: 'no-store' }).then(function(r){ 
        if(!r.ok) throw new Error("找不到資料檔 (data.json)");
        return r.json(); 
      }).then(function(detail) {
        var tMeta = window.globalData.topics.find(function(t) { return t.id === topicId; }) || { id: topicId, name: 'Unknown' };
        tMeta.items = detail.items; 
        window.globalData.lessonCache[topicId] = tMeta; 
        return tMeta; 
      }).catch(function(err){
        showFatalError('載入課題失敗：' + err.message);
        throw err;
      });
    }

          var w = img.width, h = img.height, max = window.CONFIG.IMAGE_SETTINGS.MAX_SIZE;

          var cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h; cvs.getContext('2d').drawImage(img, 0, 0, w, h);
          var b64 = cvs.toDataURL('image/jpeg', window.CONFIG.IMAGE_SETTINGS.QUALITY).split(',')[1];
          callGasApi('analyzeImagePositions', { base64Image: b64, modelName: m }).then(function(res) {
            document.getElementById('upload-btn').disabled = false; stat.innerText = '';
            var cleanItems = res.items.map(function(it) {

            document.getElementById('upload-btn').disabled = false; stat.innerText = '❌ 錯誤: ' + err.message;
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(f);

    window.saveGridEditor = function() {
      var tName = document.getElementById('grid-topic-name').value.trim() || 'Untitled';
      var id = gridEditorState.topicId;
      var meta = { id: id, name: tName, date: window.getFormattedTime() };
      
      if (gridEditorState.isNew) window.globalData.topics.unshift(meta);
      else { var idx = window.globalData.topics.findIndex(function(x){ return x.id === id; }); if (idx !== -1) window.globalData.topics[idx] = meta; }
      window.globalData.lessonCache[id] = Object.assign({}, meta, { items: gridEditorState.items });
      window.refreshUI(); window.closeGridEditor();

      var filesToCommit = [];
      filesToCommit.push({ path: 'lessons_index.json', content: JSON.stringify(window.globalData.topics, null, 2) });
      filesToCommit.push({ path: getTopicBase(id) + '/data.json', content: JSON.stringify({ items: gridEditorState.items }, null, 2) });
      if (gridEditorState.isNew && gridEditorState.base64) {
        filesToCommit.push({ path: getTopicBase(id) + '/image.jpg', base64: gridEditorState.base64 });
      }

      syncEngine.initialPayload = { files: filesToCommit };
      var words = gridEditorState.items.map(function(x){ return x.word; });
      window.CONFIG.VOICE_MODELS.forEach(function(vConfig) {
        var pts = vConfig.split(',');
        words.forEach(function(w) { syncEngine.queue.push({ topicId: id, word: w, voiceName: pts[0], langCode: pts[1], engine: pts[2] }); });
      });
      syncEngine.totalInQueue = syncEngine.queue.length; startSyncEngine();

    // ----------------------------------------------------
    // 下載與同步引擎
    // ----------------------------------------------------
    function startSyncEngine() {
      if (syncEngine.active) return; 
      syncEngine.active = true; updateSyncBadge(false, 0, '待下載後同步...'); document.getElementById('download-controller').style.display = 'flex'; processSyncQueue();
    }

    function processSyncQueue() {
      document.getElementById('dl-detail-text').innerText = '生成中 (' + (syncEngine.totalInQueue - syncEngine.queue.length) + '/' + syncEngine.totalInQueue + ')';
      if (syncEngine.queue.length === 0 || syncEngine.commitBatch.length >= 10) {
        if (syncEngine.commitBatch.length > 0 || syncEngine.initialPayload) flushCommitBatch();
        else { syncEngine.active = false; syncEngine.totalInQueue = 0; document.getElementById('download-controller').style.display = 'none'; updateSyncBadge(false, 0); }
        return;
      }
      var task = syncEngine.queue.shift();
      callGasApi('fetchTtsAudio', task).then(function(res) {
        if (res.base64) {
          syncEngine.commitBatch.push({ path: getAudioPath(task.topicId, task.voiceName, task.word), base64: res.base64 });
          if (!audioState[task.voiceName]) audioState[task.voiceName] = {}; audioState[task.voiceName][task.word] = { base64: res.base64 };
        }
      }).catch(function() { updateSyncBadge(false, 0, '下載失敗: ' + task.word); }).finally(processSyncQueue);
    }

    function flushCommitBatch() {
      updateSyncBadge(true, 0, '自動同步...');
      var payloadFiles = (syncEngine.initialPayload ? syncEngine.initialPayload.files : []).concat(syncEngine.commitBatch);
      syncEngine.initialPayload = null; syncEngine.commitBatch = [];
      callGasApi('commitToGitHub', { commitSha: window.globalData.commitSha, files: payloadFiles }).then(function(res) {
        window.globalData.commitSha = res.commitSha; localStorage.setItem('latestCommitSha', res.commitSha);
        updateSyncBadge(false, 0, '待下載後同步...'); processSyncQueue();
      }).catch(function(err) { updateSyncBadge(false, 0, '同步錯誤: ' + err.message); syncEngine.active = false; });
    }

    // ----------------------------------------------------
    // 音檔檢查與自癒 (嚴格 GET)

    window.openAudioInspectModal = function(topicId) {
      currentInspectingTopicId = topicId; currentMissingAudioTasks = [];
      var modal = document.getElementById('audio-inspect-modal');
      var tMeta = window.globalData.topics.find(function(x) { return x.id === topicId; });
      document.getElementById('inspect-topic-title').innerText = tMeta ? tMeta.name : topicId;
      document.getElementById('inspect-content-list').innerHTML = '<div class="text-center text-slate-400 py-6">⏳ 檢查 GitHub 檔案中...</div>';
      modal.classList.remove('hidden'); modal.classList.add('flex');

      ensureTopicDetailLoaded(topicId).then(function(tData) {
        var items = tData.items || [], voiceModels = window.CONFIG.VOICE_MODELS, checkPromises = [];
        voiceModels.forEach(function(vConfig) {
          var pts = vConfig.split(','), vName = pts[0], langCode = pts[1], engine = pts[2];
          items.forEach(function(it) {
            var url = getAudioRawUrl(topicId, vName, it.word);
            var p = fetch(url, { method: 'GET', headers: { 'Range': 'bytes=0-0' }, cache: 'no-store' })
              .then(function(r) { return { word: it.word, voiceName: vName, langCode: langCode, engine: engine, ok: (r.ok || r.status === 206), activeUrl: url }; })
              .catch(function() { return { word: it.word, voiceName: vName, langCode: langCode, engine: engine, ok: false, activeUrl: url }; });
            checkPromises.push(p);
          });
        });
        return Promise.all(checkPromises).then(function(results) { renderAudioInspectResults(results, items); });
      }).catch(function(err) { document.getElementById('inspect-content-list').innerHTML = '<div class="text-center text-red-500 py-4">檢查失敗: ' + err.message + '</div>'; });
    };

    function renderAudioInspectResults(results, items) {
      var container = document.getElementById('inspect-content-list'); container.innerHTML = ''; currentMissingAudioTasks = [];
      var grouped = {};
      results.forEach(function(r) {
        if (!grouped[r.voiceName]) grouped[r.voiceName] = []; grouped[r.voiceName].push(r);
        if (!r.ok) currentMissingAudioTasks.push({ topicId: currentInspectingTopicId, word: r.word, voiceName: r.voiceName, langCode: r.langCode, engine: r.engine });
      });
      for (var vName in grouped) {
        var list = grouped[vName], readyCount = list.filter(function(x) { return x.ok; }).length, isAllReady = (readyCount === list.length);
        var card = document.createElement('div'); card.className = 'p-2.5 rounded-xl border ' + (isAllReady ? 'border-emerald-200 bg-emerald-50/40' : 'border-amber-200 bg-amber-50/40');
        var header = '<div class="flex justify-between items-center font-bold mb-1.5"><span class="text-slate-700 truncate max-w-[190px]">' + vName + '</span><span class="' + (isAllReady ? 'text-emerald-600' : 'text-amber-600') + '">' + readyCount + '/' + list.length + ' ' + (isAllReady ? '✅' : '⚠️') + '</span></div>';
        var wordsGrid = '<div class="grid grid-cols-2 gap-1 mt-1">';
        list.forEach(function(item) {
          wordsGrid += '<div class="flex justify-between items-center bg-white px-2 py-1 rounded border border-slate-200 text-[11px]"><span class="truncate ' + (item.ok ? 'text-slate-700 font-bold' : 'text-red-400') + '">' + item.word + '</span>' +
            (item.ok ? '<button onclick="window.playAudioDirect(\'' + item.activeUrl + '\')" class="text-indigo-600 font-bold px-1">▶️</button>' : '<span class="text-red-400 font-bold">缺</span>') + '</div>';
        });
        card.innerHTML = header + wordsGrid + '</div>'; container.appendChild(card);
      }
      var badge = document.getElementById('badge-voice-' + currentInspectingTopicId);
      if (badge) { badge.innerText = currentMissingAudioTasks.length === 0 ? '✅ 音檔齊全' : '⚠️ 缺 ' + currentMissingAudioTasks.length + ' 個'; badge.className = 'text-[11px] font-bold ' + (currentMissingAudioTasks.length === 0 ? 'text-emerald-600' : 'text-amber-600'); }
    }
    window.closeAudioInspectModal = function() { document.getElementById('audio-inspect-modal').classList.add('hidden'); document.getElementById('audio-inspect-modal').classList.remove('flex'); };
    window.playAudioDirect = function(url) { if (currentAudioPlayer) currentAudioPlayer.pause(); currentAudioPlayer = new Audio(url); currentAudioPlayer.play().catch(function(){ showFatalError('音檔無法播放'); }); };
    
    window.healMissingAudio = function() {

    };

    window.onTopicSelectChange = function() {
      var tId = document.getElementById('topic-select').value; if (!tId) return;
      ensureTopicDetailLoaded(tId).then(function(tData) {
        var items = tData.items || [];
        window.CONFIG.VOICE_MODELS.forEach(function(vConfig) {
          var pts = vConfig.split(','), vName = pts[0], langCode = pts[1], engine = pts[2];
          items.forEach(function(it) {
            fetch(getAudioRawUrl(tId, vName, it.word), { method: 'GET', headers: { 'Range': 'bytes=0-0' }, cache: 'no-store' }).then(function(r) {
              if (!r.ok && r.status !== 206) { syncEngine.queue.push({ topicId: tId, word: it.word, voiceName: vName, langCode: langCode, engine: engine }); syncEngine.totalInQueue = syncEngine.queue.length; startSyncEngine(); }
            }).catch(function() {
              syncEngine.queue.push({ topicId: tId, word: it.word, voiceName: vName, langCode: langCode, engine: engine }); syncEngine.totalInQueue = syncEngine.queue.length; startSyncEngine();
            });
          });
        });
      });
    };

    // ----------------------------------------------------
    // 測驗與播放邏輯 (四選一嚴格排版)
    // ----------------------------------------------------
    window.changeImageHeight = function(delta) { quizImgHeight = Math.max(144, Math.min(480, quizImgHeight + delta)); localStorage.setItem('quizImgHeight', quizImgHeight); var cvs = document.getElementById('word-canvas'); if (cvs) cvs.style.height = quizImgHeight + 'px'; };
    window.startQuiz = function() {
      var s = document.getElementById('topic-select'); if (!s.value) return alert('請選擇課題');
      currentTopicId = s.value; currentTopicName = s.options[s.selectedIndex].text;
      document.getElementsByName('quizMode').forEach(function(r) { if (r.checked) currentQuizMode = r.value; });
      var btn = document.getElementById('start-quiz-btn'); btn.disabled = true; btn.innerHTML = '⏳ 載入中...';

      ensureTopicDetailLoaded(currentTopicId).then(function(tData) {
        var qArray = (tData.items || []).slice();
        for (var i = qArray.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = qArray[i]; qArray[i] = qArray[j]; qArray[j] = tmp; }
        currentQuestions = qArray; currentIndex = 0; currentScore = 0; mistakes = []; currentTypedAnswer = '';
        var img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = function() {
          btn.disabled = false; btn.innerHTML = '▶️ 開始測驗'; gridEditorState.imgObj = img;
          document.getElementById('quiz-setup').classList.add('hidden'); document.getElementById('quiz-active').classList.remove('hidden'); document.getElementById('main-nav').classList.add('hidden');
          document.getElementById('view-mode-ui').classList.toggle('hidden', currentQuizMode !== 'view'); document.getElementById('type-mode-ui').classList.toggle('hidden', currentQuizMode !== 'type'); document.getElementById('mc-mode-ui').classList.toggle('hidden', currentQuizMode !== 'mc'); document.getElementById('score-container').classList.toggle('hidden', currentQuizMode === 'view' || currentQuizMode === 'mc');
          document.getElementById('word-canvas').style.height = quizImgHeight + 'px';
          window.renderCurrentQuestion();
        };
        img.onerror = function() { btn.disabled = false; btn.innerHTML = '▶️ 開始測驗'; showFatalError("無法讀取測驗圖片"); };
        img.src = getTopicImageUrl(currentTopicId);
      });
    };

    window.renderCurrentQuestion = function() {
      if (currentIndex >= currentQuestions.length) return window.finishQuiz();
      document.getElementById('q-progress').innerText = (currentIndex + 1) + '/' + currentQuestions.length; document.getElementById('q-score').innerText = currentScore;
      var q = currentQuestions[currentIndex], cvs = document.getElementById('word-canvas'), ctx = cvs.getContext('2d'); ctx.clearRect(0, 0, cvs.width, cvs.height);
      var b = q.box_2d, img = gridEditorState.imgObj;
      if (b && b.length === 4 && img) {
        var sx = b[1] > 1 ? b[1] : b[1] * img.width, sy = b[0] > 1 ? b[0] : b[0] * img.height, ex = b[3] > 1 ? b[3] : b[3] * img.width, ey = b[2] > 1 ? b[2] : b[2] * img.height, sw = ex - sx, sh = ey - sy;
        cvs.width = sw; cvs.height = sh; ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      }
      
      if (currentQuizMode === 'type') { currentTypedAnswer = ''; document.getElementById('fake-answer-input').innerText = ''; } 
      else if (currentQuizMode === 'mc') {
        var correct = q.word, pool = currentQuestions.map(function(item){ return item.word; }).filter(function(w){ return w.toLowerCase() !== correct.toLowerCase(); }); pool.sort(function(){ return Math.random() - 0.5; });
        var rawChoices = [correct, pool[0]||'A', pool[1]||'B', pool[2]||'C'].sort(function(){ return Math.random() - 0.5; });
        var longWords = [], shortWords = [];
        rawChoices.forEach(function(w) { if ((w || '').length > 9) longWords.push(w); else shortWords.push(w); });

        var layoutOrder = [], colSpanMap = [];
        if (longWords.length >= 3) {
          layoutOrder = rawChoices; colSpanMap = ['col-span-2', 'col-span-2', 'col-span-2', 'col-span-2'];
        } else if (longWords.length >= 1) {
          var row1 = longWords[0], row2 = longWords[1] || shortWords.shift(), remainingShort = shortWords;
          if (Math.random() > 0.5) remainingShort.reverse();
          layoutOrder = [row1, row2, remainingShort[0], remainingShort[1]]; colSpanMap = ['col-span-2', 'col-span-2', 'col-span-1', 'col-span-1'];
        } else {
          layoutOrder = rawChoices; colSpanMap = ['col-span-1', 'col-span-1', 'col-span-1', 'col-span-1'];
        }
        currentMcChoices = layoutOrder;
        var btns = document.querySelectorAll('.mc-btn');
        btns.forEach(function(btn, i) {
          btn.innerText = layoutOrder[i] || ''; btn.className = 'mc-btn w-full py-3.5 px-2 rounded-xl border-2 border-slate-300 font-bold text-base md:text-lg text-slate-800 bg-white shadow-sm flex items-center justify-center text-center transition-all ' + colSpanMap[i]; btn.onclick = function() { window.checkMcAnswer(i); };
        });
      }
      setTimeout(window.playCurrentQuizWord, 250);
    };

    window.playCurrentQuizWord = function() {
      var q = currentQuestions[currentIndex]; if (!q) return; var w = q.word, vCfg = (localStorage.getItem('selectedVoice') || window.CONFIG.DEFAULT_VOICE).split(','), vName = vCfg[0], langCode = vCfg[1], engine = vCfg[2];
      if (currentAudioPlayer) currentAudioPlayer.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (audioState[vName] && audioState[vName][w] && audioState[vName][w].base64) {
        currentAudioPlayer = new Audio('data:audio/mp3;base64,' + audioState[vName][w].base64); currentAudioPlayer.play(); return;
      }
      var testAudio = new Audio(getAudioRawUrl(currentTopicId, vName, w));
      testAudio.play().then(function() { currentAudioPlayer = testAudio; }).catch(function() {
        if (window.speechSynthesis) { var u = new SpeechSynthesisUtterance(w); u.lang = langCode; window.speechSynthesis.speak(u); }
        syncEngine.queue.push({ topicId: currentTopicId, word: w, voiceName: vName, langCode: langCode, engine: engine }); syncEngine.totalInQueue = syncEngine.queue.length; startSyncEngine();
      });
    };

    window.checkMcAnswer = function(idx) {
      var btns = document.querySelectorAll('.mc-btn');
      if (currentMcChoices[idx].toLowerCase() === currentQuestions[currentIndex].word.toLowerCase()) {
        btns[idx].classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800'); setTimeout(function() { currentIndex++; window.renderCurrentQuestion(); }, 550);
      } else { btns[idx].classList.add('bg-red-100', 'border-red-500', 'text-red-800'); window.playCurrentQuizWord(); }
    };
    window.handleVK = function(k) {
      if (currentQuizMode !== 'type') return;
      if (k === 'DEL') currentTypedAnswer = currentTypedAnswer.slice(0, -1); else if (k === 'ENTER') window.submitAnswer(); else currentTypedAnswer += k.toLowerCase();
      document.getElementById('fake-answer-input').innerText = currentTypedAnswer.toLowerCase();
    };
    window.submitAnswer = function() {
      var ans = currentTypedAnswer.trim().toLowerCase(), cor = currentQuestions[currentIndex].word.trim().toLowerCase();
      if (!ans) return;
      if (ans === cor) currentScore++; else { mistakes.push(currentQuestions[currentIndex].word); alert('答錯！正確為: ' + currentQuestions[currentIndex].word); }
      currentIndex++; window.renderCurrentQuestion();
    };
    window.cancelQuiz = function() {
      if (!confirm('結束測驗？')) return;
      if (currentAudioPlayer) currentAudioPlayer.pause(); if (window.speechSynthesis) window.speechSynthesis.cancel();
      document.getElementById('quiz-active').classList.add('hidden'); document.getElementById('quiz-setup').classList.remove('hidden'); document.getElementById('main-nav').classList.remove('hidden');
    };
    window.finishQuiz = function() {
      document.getElementById('quiz-active').classList.add('hidden'); document.getElementById('quiz-setup').classList.remove('hidden'); document.getElementById('main-nav').classList.remove('hidden');
      if (currentQuizMode === 'mc') return alert('溫習完成！');
      var scoreStr = currentQuizMode === 'view' ? '手寫' : (currentScore + '/' + currentQuestions.length + '(打字)'), detailsStr = currentQuizMode === 'view' ? '順序: ' + currentQuestions.map(function(q,i){ return (i+1) + '.' + q.word; }).join(', ') : (mistakes.length > 0 ? '錯誤: ' + mistakes.join(', ') : '全對');
      alert(currentQuizMode === 'view' ? '測驗結束！' : '得分: ' + currentScore);
      updateSyncBadge(true, 0, '儲存紀錄...');
      var payloadFiles = [{ path: 'records.json', content: '' }];
      callGasApi('recordQuizResult', { topicId: currentTopicId, topicName: currentTopicName, score: scoreStr, details: detailsStr, commitSha: window.globalData.commitSha })
      .then(function(res) {
        if (res.newRecord) window.globalData.records.unshift(res.newRecord);
        if (res.commitSha) { window.globalData.commitSha = res.commitSha; localStorage.setItem('latestCommitSha', res.commitSha); }
        window.refreshUI(); updateSyncBadge(false, 0);
      }).catch(function(err) { updateSyncBadge(false, 0, '儲存錯誤: ' + err.message); });
    };

    window.switchTab = function(tName) {
      ['quiz', 'topics', 'analytics'].forEach(function(n) { document.getElementById('tab-' + n).classList.add('hidden'); });
      document.getElementById('tab-' + tName).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(function(b) {
        b.className = 'nav-btn flex-1 py-1.5 rounded-lg text-sm md:text-base font-bold bg-slate-700 text-white shadow-sm';
        if (b.id === 'nav-' + tName) b.className = 'nav-btn flex-1 py-1.5 rounded-lg text-sm md:text-base font-bold bg-amber-500 text-slate-900 shadow-sm';
      });
    };
    window.refreshUI = function() {
      var select = document.getElementById('topic-select'); select.innerHTML = '<option value="">請選擇課題</option>';
      var ul = document.getElementById('topic-list-ul'); ul.innerHTML = '';
      window.globalData.topics.forEach(function(t) {
        select.innerHTML += '<option value="' + t.id + '">' + t.name + '</option>';
        ul.innerHTML += '<li class="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-lg mb-2 shadow-sm"><div class="flex flex-col flex-1 min-w-0 pr-2"><span class="font-bold text-slate-700 text-base truncate">' + t.name + '</span><span id="badge-voice-' + t.id + '" class="text-[11px] text-slate-400 font-medium">點擊檢查音檔...</span></div><div class="flex space-x-1.5 shrink-0"><button onclick="window.openAudioInspectModal(\'' + t.id + '\')" class="text-amber-700 font-bold px-2.5 py-1.5 bg-amber-50 border border-amber-200 rounded-lg text-xs shadow-sm">🎧 音檔</button><button onclick="window.openTopicEditor(\'' + t.id + '\')" class="text-indigo-600 font-bold px-3 py-1.5 bg-indigo-50 border border-indigo-200 rounded-lg text-xs shadow-sm">編輯</button><button onclick="window.deleteTopic(\'' + t.id + '\')" class="text-red-500 font-bold px-3 py-1.5 bg-red-50 border border-red-200 rounded-lg text-xs shadow-sm">刪除</button></div></li>';
      });
      var filter = document.getElementById('record-filter'), currentFilter = filter ? filter.value : '';
      if (filter) { filter.innerHTML = '<option value="">📜 顯示所有課題紀錄</option>'; Array.from(new Set((window.globalData.records || []).map(function(r) { return r[2]; }))).forEach(function(tName) { filter.innerHTML += '<option value="' + tName + '"' + (tName === currentFilter ? ' selected' : '') + '>' + tName + '</option>'; }); }
      window.renderRecords(currentFilter);
    };
    window.renderRecords = function(filterTopic) {
      var list = document.getElementById('records-list'); list.innerHTML = ''; var records = window.globalData.records || [];
      if (filterTopic) records = records.filter(function(r) { return r[2] === filterTopic; });
      if (records.length === 0) return list.innerHTML = '<p class="text-center text-slate-400 py-4 text-sm">無紀錄</p>';
      records.forEach(function(r) {
        var badgeColor = (String(r[3]||'').indexOf('10/10') !== -1 || (r[4]||'').indexOf('全對') !== -1) ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'; if (String(r[3]||'').indexOf('手寫') !== -1) badgeColor = 'bg-indigo-100 text-indigo-700';
        list.innerHTML += '<div class="bg-white border border-slate-200 rounded-lg p-3 shadow-sm mb-3"><div class="flex justify-between items-start mb-1"><span class="text-xs text-slate-500 font-medium">' + r[0] + '</span><span class="font-bold text-xs ' + badgeColor + ' px-2 py-0.5 rounded">' + String(r[3]||'') + '</span></div><div class="font-bold text-slate-800 text-sm mb-1">' + r[2] + '</div><div class="text-xs text-slate-600 bg-slate-50 p-2 rounded border border-slate-100">' + (r[4]||'無詳細紀錄') + '</div></div>';
      });
    };

    window.openDownloadBar = function(e){ e.stopPropagation(); document.getElementById('download-controller').classList.remove('collapsed'); };
    window.closeDownloadBar = function(e){ e.stopPropagation(); document.getElementById('download-controller').classList.add('collapsed'); };
    window.prevQuestion = function() { if (currentIndex > 0) { currentIndex--; window.renderCurrentQuestion(); } };
    window.nextQuestion = function() { currentIndex++; window.renderCurrentQuestion(); };
    window.getFormattedTime = function(){ var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + ' ' + d.getHours() + ':' + d.getMinutes(); };
  </script>
</body>
</html>
