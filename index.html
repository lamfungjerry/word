<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>英語單字</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="config.js"></script>
  <script>
    document.write('<link rel="apple-touch-icon" href="' + (window.CONFIG.ICON_URL || 'icon.png') + '">');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-16">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900 shadow-md sticky top-0 z-50 pt-safe">
    <div class="px-3 pt-2 pb-2 flex flex-col space-y-2">
      <div class="flex justify-between items-center px-1">
        <div class="flex items-center space-x-2">
          <button onclick="window.openKeyModal()" class="text-lg p-1" title="API 金鑰">🔑</button>
          <h1 class="text-white text-base font-bold">英語單字系統</h1>
        </div>
        <div class="flex items-center space-x-2">
          <div id="sync-status" class="text-xs font-bold text-emerald-400 flex items-center bg-slate-800 px-2 py-1 rounded-full border border-slate-700">
            <span class="hourglass-spin">⏳</span> <span class="ml-1">載入中...</span>
          </div>
          <button onclick="window.openVoiceModal()" class="text-lg p-1">⚙️</button>
        </div>
      </div>
      <nav id="main-nav" class="flex justify-between gap-2 pb-1">
        <button id="nav-quiz" onclick="window.switchTab('quiz')" class="nav-btn flex-1 py-1.5 rounded-lg text-sm font-bold bg-amber-500 text-slate-900 shadow-sm">測驗</button>
        <button id="nav-topics" onclick="window.switchTab('topics')" class="nav-btn flex-1 py-1.5 rounded-lg text-sm font-bold bg-slate-700 text-white shadow-sm">課題</button>
        <button id="nav-analytics" onclick="window.switchTab('analytics')" class="nav-btn flex-1 py-1.5 rounded-lg text-sm font-bold bg-slate-700 text-white shadow-sm">歷程</button>
      </nav>
    </div>
  </header>

  <main class="px-3 pt-3 pb-6 max-w-lg mx-auto">
    <!-- 1. 測驗 -->
    <section id="tab-quiz">
      <div id="quiz-setup" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-3">
        <div class="mb-4">
          <label class="block text-sm font-bold text-slate-700 mb-2">📚 選擇課題</label>
          <select id="topic-select" onchange="window.onTopicSelectChange()" class="w-full p-2.5 border-2 border-slate-200 rounded-xl font-bold text-base bg-slate-50 outline-none">
            <option value="">載入中...</option>
          </select>
        </div>
        <div class="mb-5">
          <label class="block text-sm font-bold text-slate-700 mb-2">🎯 模式</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="relative cursor-pointer">
              <input type="radio" name="quizMode" value="view" class="peer sr-only" checked>
              <div class="p-2 rounded-xl border-2 border-slate-200 bg-white peer-checked:border-indigo-500 peer-checked:bg-indigo-50 text-center shadow-sm">
                <div class="text-xl mb-1">👁️</div><div class="font-bold text-xs">瀏覽</div>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="quizMode" value="type" class="peer sr-only">
              <div class="p-2 rounded-xl border-2 border-slate-200 bg-white peer-checked:border-indigo-500 peer-checked:bg-indigo-50 text-center shadow-sm">
                <div class="text-xl mb-1">⌨️</div><div class="font-bold text-xs">打字</div>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="quizMode" value="mc" class="peer sr-only">
              <div class="p-2 rounded-xl border-2 border-slate-200 bg-white peer-checked:border-emerald-500 peer-checked:bg-emerald-50 text-center shadow-sm">
                <div class="text-xl mb-1">🎲</div><div class="font-bold text-xs text-emerald-800">溫習</div>
              </div>
            </label>
          </div>
        </div>
        <button id="start-quiz-btn" onclick="window.startQuiz()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md text-lg active:bg-emerald-700">▶️ 開始測驗</button>
      </div>

      <div id="quiz-active" class="hidden space-y-2">
        <div class="flex justify-between items-center font-bold text-slate-700 bg-white p-2.5 rounded-lg shadow-sm border border-slate-200">
          <div class="flex space-x-3 text-sm">
            <span>進度: <span id="q-progress" class="text-amber-600">1/10</span></span>
            <span id="score-container" class="hidden">得分: <span id="q-score" class="text-emerald-600">0</span></span>
          </div>
          <button onclick="window.cancelQuiz()" class="text-red-500 font-bold px-3 py-1 bg-red-50 rounded-lg text-xs">✖ 取消</button>
        </div>
        <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
          <div class="w-full bg-slate-100 p-2 rounded-lg mb-3">
            <canvas id="word-canvas" class="w-full object-contain p-1 rounded bg-white shadow-sm" style="height: 220px;"></canvas>
          </div>
          <button id="quiz-play-btn" onclick="window.playCurrentQuizWord()" class="btn-play-ready font-bold px-8 py-3 rounded-full flex items-center space-x-2 mb-4 shadow-md text-lg active:scale-95">
            <span>▶️ 播放</span>
          </button>
          <!-- 瀏覽UI -->
          <div id="view-mode-ui" class="w-full flex gap-3 hidden">
            <button onclick="window.prevQuestion()" class="flex-1 bg-slate-200 text-slate-800 font-bold py-3 rounded-xl">⬅️ 上一題</button>
            <button onclick="window.nextQuestion()" id="view-next-btn" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md">下一題 ➡️</button>
          </div>
          <!-- 溫習UI -->
          <div id="mc-mode-ui" class="w-full grid grid-cols-2 gap-2 hidden">
            <button class="mc-btn w-full p-3 rounded-xl border-2 border-slate-300 font-bold text-sm bg-white shadow-sm"></button>
            <button class="mc-btn w-full p-3 rounded-xl border-2 border-slate-300 font-bold text-sm bg-white shadow-sm"></button>
            <button class="mc-btn w-full p-3 rounded-xl border-2 border-slate-300 font-bold text-sm bg-white shadow-sm"></button>
            <button class="mc-btn w-full p-3 rounded-xl border-2 border-slate-300 font-bold text-sm bg-white shadow-sm"></button>
          </div>
          <!-- 打字UI -->
          <div id="type-mode-ui" class="w-full hidden flex-col items-center">
            <div id="fake-answer-input" class="w-full p-2.5 border-2 border-slate-300 rounded-xl bg-slate-50 text-xl font-bold text-center h-12 flex items-center justify-center tracking-widest fake-cursor shadow-inner"></div>
            <div class="w-full mt-3 bg-slate-100 p-2 rounded-xl flex flex-col gap-1.5 shadow-inner">
              <div class="flex gap-1 justify-center">
                <button onclick="window.handleVK('q')" class="vk-btn">q</button><button onclick="window.handleVK('w')" class="vk-btn">w</button>
                <button onclick="window.handleVK('e')" class="vk-btn">e</button><button onclick="window.handleVK('r')" class="vk-btn">r</button>
                <button onclick="window.handleVK('t')" class="vk-btn">t</button><button onclick="window.handleVK('y')" class="vk-btn">y</button>
                <button onclick="window.handleVK('u')" class="vk-btn">u</button><button onclick="window.handleVK('i')" class="vk-btn">i</button>
                <button onclick="window.handleVK('o')" class="vk-btn">o</button><button onclick="window.handleVK('p')" class="vk-btn">p</button>
              </div>
              <div class="flex gap-1 justify-center px-4">
                <button onclick="window.handleVK('a')" class="vk-btn">a</button><button onclick="window.handleVK('s')" class="vk-btn">s</button>
                <button onclick="window.handleVK('d')" class="vk-btn">d</button><button onclick="window.handleVK('f')" class="vk-btn">f</button>
                <button onclick="window.handleVK('g')" class="vk-btn">g</button><button onclick="window.handleVK('h')" class="vk-btn">h</button>
                <button onclick="window.handleVK('j')" class="vk-btn">j</button><button onclick="window.handleVK('k')" class="vk-btn">k</button>
                <button onclick="window.handleVK('l')" class="vk-btn">l</button>
              </div>
              <div class="flex gap-1 justify-center">
                <button onclick="window.handleVK('DEL')" class="vk-btn vk-btn-wide text-red-600">⌫</button>
                <button onclick="window.handleVK('z')" class="vk-btn">z</button><button onclick="window.handleVK('x')" class="vk-btn">x</button>
                <button onclick="window.handleVK('c')" class="vk-btn">c</button><button onclick="window.handleVK('v')" class="vk-btn">v</button>
                <button onclick="window.handleVK('b')" class="vk-btn">b</button><button onclick="window.handleVK('n')" class="vk-btn">n</button>
                <button onclick="window.handleVK('m')" class="vk-btn">m</button>
                <button onclick="window.handleVK('ENTER')" class="vk-btn vk-btn-wide bg-emerald-100 text-emerald-800">↵</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 課題管理 -->
    <section id="tab-topics" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold mb-3">📸 新增課題 (AI 自動切割)</h2>
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">AI 引擎</label>
            <select id="ai-model-select" class="w-full p-2 border rounded-lg bg-slate-50 text-sm font-bold outline-none">
              <option value="">載入中...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">上傳圖片</label>
            <input type="file" id="new-topic-img" accept="image/png, image/jpeg" class="w-full text-sm border p-1.5 rounded-lg">
          </div>
          <button onclick="window.uploadTopic()" id="upload-btn" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg shadow-sm">分析圖片</button>
          <div id="upload-status" class="text-xs font-bold text-amber-600 text-center whitespace-pre-wrap"></div>
        </div>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold mb-3">📚 已有課題</h2>
        <ul id="topic-list-ul" class="space-y-2 text-sm max-h-[50vh] overflow-y-auto pr-1"></ul>
      </div>
    </section>

    <!-- 3. 歷程 -->
    <section id="tab-analytics" class="hidden">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold mb-3">學生紀錄</h2>
        <div id="records-list" class="space-y-2 max-h-[65vh] overflow-y-auto pr-1"></div>
      </div>
    </section>
  </main>

  <!-- 📱 2x5 網格編輯器 (新增與編輯共用) -->
  <div id="grid-editor-modal" class="fixed inset-0 bg-slate-100 z-[70] hidden flex-col">
    <div class="bg-white p-2.5 flex justify-between items-center shadow-sm shrink-0 border-b pt-safe">
      <button onclick="window.closeGridEditor()" class="text-red-500 font-bold px-3 py-1.5 bg-red-50 rounded-lg text-sm">✖ 取消</button>
      <input type="text" id="grid-topic-name" class="flex-1 mx-3 p-1.5 text-center font-bold text-base border-b-2 border-indigo-200 focus:border-indigo-500 bg-transparent outline-none rounded-none" placeholder="課題名稱">
      <button onclick="window.saveGridEditor()" id="grid-save-btn" class="bg-emerald-600 text-white px-4 py-1.5 rounded-lg font-bold text-sm shadow-sm">💾 儲存</button>
    </div>
    <div class="flex-1 overflow-y-auto p-3">
      <div class="grid grid-cols-2 gap-3 pb-6" id="grid-cards-container">
        <!-- 10 張卡片會動態生成喺度 -->
      </div>
    </div>
  </div>

  <!-- 單字修改彈窗 -->
  <div id="single-edit-modal" class="fixed inset-0 bg-slate-900/60 z-[80] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white w-full max-w-xs rounded-2xl p-4 flex flex-col items-center shadow-2xl">
      <h3 class="font-bold text-sm text-slate-500 mb-2">修改生字 (<span id="single-edit-idx"></span>)</h3>
      <canvas id="single-edit-canvas" class="w-full h-32 object-contain bg-slate-100 rounded border border-slate-200 mb-3"></canvas>
      <input type="text" id="single-edit-input" class="w-full p-3 border-2 border-indigo-300 rounded-xl text-center font-bold text-xl outline-none focus:border-indigo-500 mb-4" placeholder="輸入正確生字">
      <button onclick="window.confirmSingleEdit()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-base shadow-md active:bg-indigo-700">確定修改</button>
    </div>
  </div>

  <!-- 其他 Modals -->
  <div id="key-modal" class="fixed inset-0 bg-slate-900/60 z-[90] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-base font-bold">🔑 金鑰設定</h3>
        <button onclick="document.getElementById('key-modal').classList.add('hidden')" class="text-slate-400 font-bold text-lg">✖</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="font-bold text-slate-700 text-xs block mb-1">Gemini API Key</label>
          <input type="password" id="input-gemini-key" class="w-full p-2.5 border rounded-lg bg-slate-50">
        </div>
        <div>
          <label class="font-bold text-slate-700 text-xs block mb-1">Azure TTS Key</label>
          <input type="password" id="input-azure-key" class="w-full p-2.5 border rounded-lg bg-slate-50">
        </div>
        <div>
          <label class="font-bold text-slate-700 text-xs block mb-1">Google Cloud TTS Key</label>
          <input type="password" id="input-gcptts-key" class="w-full p-2.5 border rounded-lg bg-slate-50">
        </div>
        <div>
          <label class="font-bold text-slate-700 text-xs block mb-1">GitHub Token</label>
          <input type="password" id="input-github-token" class="w-full p-2.5 border rounded-lg bg-slate-50">
        </div>
      </div>
      <button onclick="window.saveAllKeys()" id="save-keys-btn" class="w-full mt-5 bg-emerald-600 text-white font-bold py-3 rounded-xl shadow">儲存設定</button>
    </div>
  </div>

  <div id="voice-modal" class="fixed inset-0 bg-slate-900/60 z-[90] hidden items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-5">
      <h3 class="text-base font-bold mb-3">⚙️ 測驗發音設定</h3>
      <select id="voice-select" onchange="window.onVoiceChange()" class="w-full p-3 border-2 border-slate-200 rounded-xl font-bold text-sm bg-slate-50 outline-none"></select>
      <button onclick="document.getElementById('voice-modal').classList.add('hidden')" class="w-full mt-5 bg-indigo-600 text-white font-bold py-3 rounded-xl shadow">完成</button>
    </div>
  </div>

  <div id="download-controller" class="floating-dl-wrapper collapsed" style="display:none;">
    <div class="floating-dl-toggle" onclick="window.openDownloadBar(event)"><span class="hourglass-spin">⏳</span></div>
    <div class="floating-dl-content" onclick="window.closeDownloadBar(event)">
      <span class="hourglass-spin text-sm">⏳</span>
      <span id="dl-detail-text" class="text-xs font-bold text-slate-800 whitespace-nowrap">準備中...</span>
    </div>
  </div>

  <script>
    // 系統狀態
    window.globalData = {
      topics: [], records: [], lessonCache: {},
      commitSha: localStorage.getItem('latestCommitSha') || ''
    };
    var audioState = {}; // { voiceName: { word: { status: 'ready', url/base64: '...' } } }
    var syncEngine = {
      queue: [], // [{ word, voiceName, langCode, engine }]
      active: false,
      commitBatch: [], // 收集完成的 Base64，滿 10 個推 GitHub
      totalInQueue: 0,
      initialPayload: null // 新增課題時的圖片與 JSON
    };
    var gridEditorState = { isNew: true, topicId: '', items: [], imgObj: null, base64: '' };
    var activeEditIdx = -1, dlBarTimer = null, currentAudioPlayer = null;
    var currentQuestions = [], currentIndex = 0, currentScore = 0, currentTopicId = '', mistakes = [];

    // --- 基礎橋接與 UI 控制 ---
    function callGasApi(action, payload) {
      if(!window.CONFIG || !window.CONFIG.GEMINI_SETTINGS) return Promise.reject(new Error('config.js 設定遺失'));
      var fullPayload = Object.assign({}, payload, { CONFIG: window.CONFIG });
      return fetch(window.CONFIG.GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: fullPayload })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if(d.status === 'error') throw new Error(d.message); return d;
      });
    }

    function updateSyncBadge(isSyncing, unsyncedCount, customText) {
      var s = document.getElementById('sync-status');
      if (!s) return;
      if (isSyncing) {
        s.innerHTML = '<span class="hourglass-spin">⏳</span> <span class="ml-1">' + (customText || '自動同步...') + '</span>';
        s.className = 'text-xs font-bold text-amber-400 flex items-center bg-slate-800 px-2 py-1 rounded-full border border-amber-500/40';
      } else if (customText) {
        var icon = customText.indexOf('失敗') !== -1 ? '⚠️' : '☁️';
        var color = customText.indexOf('失敗') !== -1 ? 'text-red-400 border-red-500/40' : 'text-amber-300 border-amber-500/40';
        s.innerHTML = '<span>' + icon + '</span> <span class="ml-1">' + customText + '</span>';
        s.className = 'text-xs font-bold ' + color + ' flex items-center bg-slate-800 px-2 py-1 rounded-full border';
      } else if (unsyncedCount > 0) {
        s.innerHTML = '<span>☁️</span> <span class="ml-1">待同步 (' + unsyncedCount + ')</span>';
        s.className = 'text-xs font-bold text-amber-300 flex items-center bg-slate-800 px-2 py-1 rounded-full border border-amber-500/40';
      } else {
        s.innerHTML = '<span>✅</span> <span class="ml-1">已同步</span>';
        s.className = 'text-xs font-bold text-emerald-400 flex items-center bg-slate-800 px-2 py-1 rounded-full border border-slate-700';
      }
    }

    function initVoiceSelect() {
      var sel = document.getElementById('voice-select');
      sel.innerHTML = '';
      window.CONFIG.VOICE_MODELS.forEach(function(v) {
        var opt = document.createElement('option');
        opt.value = v; opt.innerText = v.split(',')[0];
        sel.appendChild(opt);
      });
      var saved = localStorage.getItem('selectedVoice') || window.CONFIG.DEFAULT_VOICE;
      sel.value = saved; if(sel.selectedIndex === -1) sel.selectedIndex = 0;
    }

    // --- 開機與資料載入 ---
    window.addEventListener('DOMContentLoaded', function() {
      initVoiceSelect();
      loadModels();
      
      var url = 'https://api.github.com/repos/' + window.CONFIG.GITHUB_REPO + '/commits/' + window.CONFIG.GITHUB_BRANCH;
      fetch(url, { headers: { 'Accept': 'application/vnd.github.sha' }, cache: 'no-store' })
      .then(function(r) { return r.ok ? r.text() : ''; })
      .then(function(sha) {
        if(sha) { window.globalData.commitSha = sha.trim(); localStorage.setItem('latestCommitSha', sha.trim()); }
        var base = 'https://raw.githubusercontent.com/' + window.CONFIG.GITHUB_REPO + '/' + window.globalData.commitSha + '/';
        return Promise.all([
          fetch(base + 'lessons_index.json', { cache: 'no-store' }).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}),
          fetch(base + 'records.json', { cache: 'no-store' }).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];})
        ]);
      }).then(function(res) {
        window.globalData.topics = res[0]; window.globalData.records = res[1];
        window.refreshUI();
        updateSyncBadge(false, 0);
      });
    });

    function loadModels() {
      var sel = document.getElementById('ai-model-select');
      sel.innerHTML = '<option>⏳ 載入中...</option>';
      callGasApi('getGeminiModels', {}).then(function(res) {
        sel.innerHTML = '';
        (res.models || [window.CONFIG.GEMINI_SETTINGS.DEFAULT_MODEL]).forEach(function(m) {
          var opt = document.createElement('option'); opt.value = m.id; opt.innerText = m.displayName; sel.appendChild(opt);
        });
      }).catch(function() {
        sel.innerHTML = '<option value="' + window.CONFIG.GEMINI_SETTINGS.DEFAULT_MODEL.id + '">⚠️ 載入失敗 (使用預設)</option>';
      });
    }

    function ensureTopicDetailLoaded(topicId) {
      if (window.globalData.lessonCache[topicId] && window.globalData.lessonCache[topicId].items) {
        return Promise.resolve(window.globalData.lessonCache[topicId]);
      }
      var tMeta = window.globalData.topics.find(function(t) { return t.id === topicId; });
      var url = 'https://raw.githubusercontent.com/' + window.CONFIG.GITHUB_REPO + '/' + window.globalData.commitSha + '/lessons/' + topicId + '.json';
      return fetch(url, { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(detail) {
        if(tMeta) { tMeta.items = detail.items; window.globalData.lessonCache[topicId] = tMeta; return tMeta; }
        return detail; // 例外
      });
    }

    // --- 2x5 網格編輯器 ---
    window.uploadTopic = function() {
      var n = 'Words of the Week', f = document.getElementById('new-topic-img').files[0];
      var m = document.getElementById('ai-model-select').value, stat = document.getElementById('upload-status');
      if(!f) return alert('請選擇圖片');
      stat.innerHTML = '<span class="hourglass-spin">⏳</span> AI 處理中...';
      document.getElementById('upload-btn').disabled = true;

      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var w = img.width, h = img.height, max = window.CONFIG.IMAGE_SETTINGS.MAX_SIZE;
          if(w > max || h > max) { if(w > h) { h = Math.round(h*max/w); w = max; } else { w = Math.round(w*max/h); h = max; } }
          var cvs = document.createElement('canvas'); cvs.width = w; cvs.height = h;
          cvs.getContext('2d').drawImage(img, 0, 0, w, h);
          var b64 = cvs.toDataURL('image/jpeg', window.CONFIG.IMAGE_SETTINGS.QUALITY).split(',')[1];
          
          callGasApi('analyzeImagePositions', { base64Image: b64, modelName: m }).then(function(res) {
            document.getElementById('upload-btn').disabled = false; stat.innerText = '';
            // 強制清洗為 0.0 ~ 1.0 比例座標
            var cleanItems = res.items.map(function(it) {
              var b = it.box_2d || it.boundingBox;
              if(b && b.length === 4) {
                return { word: it.word||it.text||'', box_2d: [ b[0]>1?b[0]/h:b[0], b[1]>1?b[1]/w:b[1], b[2]>1?b[2]/h:b[2], b[3]>1?b[3]/w:b[3] ] };
              }
              return it;
            });
            openGridEditor(true, { name: n, items: cleanItems }, b64, img.src);
          }).catch(function(err) {
            document.getElementById('upload-btn').disabled = false; stat.innerText = '❌ 錯誤: ' + err.message;
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(f);
    };

    window.openTopicEditor = function(id) {
      var t = window.globalData.topics.find(function(x) { return x.id === id; });
      ensureTopicDetailLoaded(id).then(function(tData) {
        var url = 'https://raw.githubusercontent.com/' + window.CONFIG.GITHUB_REPO + '/' + window.globalData.commitSha + '/' + t.imagePath;
        openGridEditor(false, tData, null, url);
      });
    };

    function openGridEditor(isNew, data, base64, imgUrl) {
      gridEditorState.isNew = isNew; gridEditorState.topicId = data.id || ('T_' + new Date().getTime());
      gridEditorState.items = JSON.parse(JSON.stringify(data.items || []));
      gridEditorState.base64 = base64; document.getElementById('grid-topic-name').value = data.name || '';
      
      var img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = function() {
        gridEditorState.imgObj = img;
        renderGridCards();
        document.getElementById('grid-editor-modal').classList.remove('hidden');
        document.getElementById('grid-editor-modal').classList.add('flex');
      };
      img.src = imgUrl;
    }

    window.closeGridEditor = function() { document.getElementById('grid-editor-modal').classList.add('hidden'); document.getElementById('grid-editor-modal').classList.remove('flex'); };

    function renderGridCards() {
      var c = document.getElementById('grid-cards-container'); c.innerHTML = '';
      gridEditorState.items.forEach(function(it, i) {
        var card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow border border-slate-200 p-2 flex flex-col items-center grid-card';
        card.onclick = function() { openSingleEdit(i); };
        
        var can = document.createElement('canvas');
        can.className = 'w-full h-20 object-contain mb-1';
        var b = it.box_2d, img = gridEditorState.imgObj;
        if(b && b.length===4) {
          var sw = (b[3]-b[1])*img.width, sh = (b[2]-b[0])*img.height;
          can.width = sw; can.height = sh;
          can.getContext('2d').drawImage(img, b[1]*img.width, b[0]*img.height, sw, sh, 0, 0, sw, sh);
        }
        
        var txt = document.createElement('div');
        txt.className = 'font-bold text-slate-800 text-sm truncate w-full text-center';
        txt.innerText = it.word || '?';
        
        card.appendChild(can); card.appendChild(txt); c.appendChild(card);
      });
    }

    function openSingleEdit(idx) {
      activeEditIdx = idx;
      var it = gridEditorState.items[idx], b = it.box_2d, img = gridEditorState.imgObj;
      var can = document.getElementById('single-edit-canvas');
      var sw = (b[3]-b[1])*img.width, sh = (b[2]-b[0])*img.height;
      can.width = sw; can.height = sh;
      can.getContext('2d').drawImage(img, b[1]*img.width, b[0]*img.height, sw, sh, 0, 0, sw, sh);
      
      document.getElementById('single-edit-idx').innerText = (idx+1) + '/10';
      document.getElementById('single-edit-input').value = it.word;
      document.getElementById('single-edit-modal').classList.remove('hidden');
      document.getElementById('single-edit-modal').classList.add('flex');
      setTimeout(function(){ document.getElementById('single-edit-input').focus(); }, 100);
    }
    
    window.confirmSingleEdit = function() {
      gridEditorState.items[activeEditIdx].word = document.getElementById('single-edit-input').value.trim();
      document.getElementById('single-edit-modal').classList.add('hidden');
      document.getElementById('single-edit-modal').classList.remove('flex');
      renderGridCards();
    };

    // --- 存檔與全自動同步引擎 (Local -> GitHub) ---
    window.saveGridEditor = function() {
      var tName = document.getElementById('grid-topic-name').value.trim() || 'Untitled';
      var id = gridEditorState.topicId;
      var meta = { id: id, name: tName, date: window.getFormattedTime(), imagePath: 'images/' + id + '.jpg' };
      
      // 更新本機 Cache
      if(gridEditorState.isNew) window.globalData.topics.unshift(meta);
      else { var idx = window.globalData.topics.findIndex(function(x){return x.id===id;}); if(idx!==-1) window.globalData.topics[idx] = meta; }
      meta.items = gridEditorState.items; window.globalData.lessonCache[id] = meta;
      window.refreshUI(); window.closeGridEditor();

      // 準備初始 Payload (JSON + Image)
      syncEngine.initialPayload = {
        meta: meta, items: meta.items,
        imgBase64: gridEditorState.isNew ? gridEditorState.base64 : null
      };
      
      // 列出所有需要下載的語音，排入隊列
      var words = meta.items.map(function(x){return x.word;});
      window.CONFIG.VOICE_MODELS.forEach(function(vConfig) {
        var pts = vConfig.split(',');
        words.forEach(function(w) {
          syncEngine.queue.push({ topicId: id, word: w, voiceName: pts[0], langCode: pts[1], engine: pts[2] });
        });
      });
      syncEngine.totalInQueue = syncEngine.queue.length;
      startSyncEngine();
    };

    function startSyncEngine() {
      if(syncEngine.active) return; syncEngine.active = true;
      updateSyncBadge(false, 0, '待下載後同步...'); document.getElementById('download-controller').style.display = 'flex';
      processSyncQueue();
    }

    function processSyncQueue() {
      document.getElementById('dl-detail-text').innerText = '雲端生成中 (' + (syncEngine.totalInQueue - syncEngine.queue.length) + '/' + syncEngine.totalInQueue + ')';
      
      if(syncEngine.queue.length === 0 || syncEngine.commitBatch.length >= 10) {
        // 滿 10 個或下載完畢，推 GitHub
        if(syncEngine.commitBatch.length > 0 || syncEngine.initialPayload) {
          flushCommitBatch();
        } else {
          syncEngine.active = false; syncEngine.totalInQueue = 0; document.getElementById('download-controller').style.display = 'none';
          updateSyncBadge(false, 0);
        }
        return;
      }
      
      var task = syncEngine.queue.shift();
      callGasApi('fetchTtsAudio', task).then(function(res) {
        if(res.base64) {
          var hash = md5(task.word.toLowerCase() + '_' + task.voiceName);
          var safeWord = task.word.replace(/[^a-zA-Z0-9]/g, "").substring(0, 20);
          var path = 'cache/T_' + task.topicId + '/' + task.voiceName + '/' + safeWord + '_' + hash + '.mp3';
          syncEngine.commitBatch.push({ path: path, base64: res.base64 });
          
          if(!audioState[task.voiceName]) audioState[task.voiceName] = {};
          audioState[task.voiceName][task.word] = { status: 'ready', base64: res.base64 };
        }
      }).catch(function(err) {
        updateSyncBadge(false, 0, '⚠️ 下載失敗 (' + task.word + ')');
      }).finally(function() {
        processSyncQueue();
      });
    }

    function flushCommitBatch() {
      updateSyncBadge(true, 0, '自動同步...');
      var payload = {
        commitSha: window.globalData.commitSha,
        initial: syncEngine.initialPayload,
        files: syncEngine.commitBatch.slice()
      };
      syncEngine.initialPayload = null; syncEngine.commitBatch = []; // 清空緩衝
      
      callGasApi('commitToGitHub', payload).then(function(res) {
        window.globalData.commitSha = res.commitSha; localStorage.setItem('latestCommitSha', res.commitSha);
        updateSyncBadge(false, 0, '待下載後同步...');
        processSyncQueue(); // 繼續下載下一批
      }).catch(function(err) {
        updateSyncBadge(false, 0, '⚠️ 同步失敗'); syncEngine.active = false;
        alert('GitHub 同步失敗: ' + err.message);
      });
    }

    // --- 測驗與播放邏輯 ---
    // (與舊版相同，播放優先取 audioState 的 base64)
    window.playCurrentQuizWord = function() {
      var w = currentQuestions[currentIndex].word;
      var vCfg = (localStorage.getItem('selectedVoice') || window.CONFIG.DEFAULT_VOICE).split(',');
      var vName = vCfg[0];
      if(currentAudioPlayer) currentAudioPlayer.pause();
      if(window.speechSynthesis) window.speechSynthesis.cancel();

      if(audioState[vName] && audioState[vName][w] && audioState[vName][w].base64) {
        currentAudioPlayer = new Audio('data:audio/mp3;base64,' + audioState[vName][w].base64);
        currentAudioPlayer.play();
      } else {
        // 如果未載入或 GitHub 未有，呼叫 Browser Speech 頂住先，並單獨觸發下載推上 GitHub
        if(window.speechSynthesis) { var u = new SpeechSynthesisUtterance(w); u.lang = vCfg[1]; window.speechSynthesis.speak(u); }
        syncEngine.queue.push({ topicId: currentTopicId, word: w, voiceName: vName, langCode: vCfg[1], engine: vCfg[2] });
        syncEngine.totalInQueue++; startSyncEngine();
      }
    };
    
    // 省略部分純 UI 切換函數 (switchTab, handleVK 等...) 保持原樣運作
    window.switchTab = function(tName) {
      ['quiz', 'topics', 'analytics'].forEach(function(n) { document.getElementById('tab-' + n).classList.add('hidden'); });
      document.getElementById('tab-' + tName).classList.remove('hidden');
      document.querySelectorAll('.nav-btn').forEach(function(b) {
        b.className = 'nav-btn flex-1 py-1.5 rounded-lg text-sm font-bold bg-slate-700 text-white shadow-sm';
        if (b.id === 'nav-' + tName) b.className = 'nav-btn flex-1 py-1.5 rounded-lg text-sm font-bold bg-amber-500 text-slate-900 shadow-sm';
      });
    };
    window.openKeyModal = function(){ document.getElementById('key-modal').classList.remove('hidden'); document.getElementById('key-modal').classList.add('flex'); }
    window.openVoiceModal = function(){ document.getElementById('voice-modal').classList.remove('hidden'); document.getElementById('voice-modal').classList.add('flex'); }
    window.openDownloadBar = function(e){ e.stopPropagation(); document.getElementById('download-controller').classList.remove('collapsed'); }
    window.closeDownloadBar = function(e){ e.stopPropagation(); document.getElementById('download-controller').classList.add('collapsed'); }
    window.getFormattedTime = function(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+d.getHours()+':'+d.getMinutes(); }
    window.refreshUI = function() {
      var select = document.getElementById('topic-select'); select.innerHTML = '<option value="">請選擇</option>';
      var ul = document.getElementById('topic-list-ul'); ul.innerHTML = '';
      window.globalData.topics.forEach(function(t) {
        select.innerHTML += '<option value="' + t.id + '">' + t.name + '</option>';
        ul.innerHTML += '<li class="flex justify-between items-center p-2.5 bg-slate-50 border rounded-lg mb-2">' +
          '<span class="font-bold text-slate-700">' + t.name + '</span>' +
          '<div class="flex space-x-2"><button onclick="window.openTopicEditor(\'' + t.id + '\')" class="text-indigo-600 font-bold px-3 py-1 bg-indigo-50 rounded">編輯</button></div></li>';
      });
    };
    // md5 小工具 (精簡版)
    function md5(str){ var hash=0; for(var i=0;i<str.length;i++){ hash=(hash<<5)-hash+str.charCodeAt(i); hash|=0; } return Math.abs(hash).toString(16); }
  </script>
